mcp_pricing:
  fee: 0
  note: >-
    MCP is not separately priced. Rendering through the MCP server spends ordinary Renderwolf
    credits; connecting, listing tools and reading metadata are free. Each MCP connection also
    carries its own budget of max(25, 10% of the plan's monthly credits) per billing period,
    capped by the organisation's remaining allowance, so a looping agent cannot drain a month.
