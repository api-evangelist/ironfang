    cache_hit: 0
  free_operations:
    - cache hits (identical request served from cache)
    - QR codes (still recorded in usage)
    - reads - usage, templates, jobs, batches, destinations, deliveries
  refunds: Credits charged before unsuccessful work are returned automatically.
  overage: >-
    None. Reaching the cap pauses work with 429 quota_exhausted and creates no overage charge -
    plans are hard-capped, not metered into overage.
  period_basis: >-
    Paid accounts meter between billing anniversaries (the `period` field shows the cycle start
    date); free accounts meter by calendar month.
