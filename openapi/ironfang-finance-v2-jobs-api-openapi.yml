    APIVersion:
      type: string
      description: The API a result was made through.
      enum:
      - v1
      - v2
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          enum:
          - unknown_field
          - repeated
          - invalid_value
          - missing
        message:
          type: string
          minLength: 1
          maxLength: 256
    Job:
      type: object
      additionalProperties: false
      description: 'One durable job, V1''s or V2''s: metadata only, never its document.

        `outcome` appears once the job has finished: `valid` or `invalid`

        when completed, `indeterminate` when failed or cancelled, with

        `failure_code`. A queued job being retried keeps the last attempt''s

        `failure_code`. `result_url` appears while the result can be read.

        '
      required:
      - schema
      - id
      - operation_id
      - position
      - api_version
      - operation
      - status
      - attempts
      - ruleset_id
      - engine_image_digest
      - usage_charged
      - result_available
      - created_at
      - expires_at
      properties:
        schema:
          type: string
          const: ironfang/finance/einvoice/job/v2
        id:
          $ref: '#/components/schemas/OpaqueID'
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
        batch_id:
          $ref: '#/components/schemas/OpaqueID'
        position:
          type: integer
          minimum: 0
          maximum: 99
          description: The job's place in its batch; 0 outside one.
        api_version:
          $ref: '#/components/schemas/APIVersion'
        operation:
          type: string
          enum:
          - validate
          - generate
          description: V2 jobs validate; a V1 job may generate.
        status:
          $ref: '#/components/schemas/JobStatus'
        outcome:
          type: string
          enum:
          - valid
          - invalid
          - indeterminate
        failure_code:
          type: string
          enum:
          - validation_timeout
          - validator_unavailable
          - internal_error
          - generation_failed
          - job_cancelled
          - job_expired
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        ruleset_id:
          $ref: '#/components/schemas/RulesetID'
        engine_image_digest:
          $ref: '#/components/schemas/ImageDigest'
          description: The engine the job is pinned to (for V2, the XML worker, or for Peppol BIS Billing 3 the Peppol validator).
        usage_charged:
          type: boolean
        result_available:
          type: boolean
        result_url:
          type: string
          pattern: ^/finance/v2/einvoices/results/[0-9a-f-]{36}$
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When an unfinished job is failed as job_expired and its document erased.
        finished_at:
          type: string
          format: date-time
    Scope:
      type: string
      enum:
      - xml
      - hybrid_pdf
    JobList:
      type: object
      additionalProperties: false
      required:
      - schema
      - jobs
      properties:
        schema:
          type: string
          const: ironfang/finance/einvoice/job-list/v2
        jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 256
    RulesetSelector:
      type: string
      pattern: ^(latest|fwrs_[a-z0-9_]{1,80})$
    Batch:
      type: object
      additionalProperties: false
      required:
      - schema
      - id
      - api_version
      - status
      - created_at
      - counts
      - jobs
      properties:
        schema:
          type: string
          const: ironfang/finance/einvoice/batch/v2
        id:
          $ref: '#/components/schemas/OpaqueID'
        api_version:
          $ref: '#/components/schemas/APIVersion'
        status:
          $ref: '#/components/schemas/BatchStatus'
        created_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/JobCounts'
        jobs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Job'
    BatchSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - api_version
      - status
      - created_at
      - counts
      - job_count
      properties:
        id:
          $ref: '#/components/schemas/OpaqueID'
        api_version:
          $ref: '#/components/schemas/APIVersion'
        status:
          $ref: '#/components/schemas/BatchStatus'
        created_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/JobCounts'
        job_count:
          type: integer
          minimum: 1
          maximum: 100
    JobCounts:
      type: object
      additionalProperties: false
      required:
      - queued
      - running
      - completed
      - failed
      - cancelled
      properties:
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
    JobRequest:
      type: object
      additionalProperties: false
      required:
      - document_base64
      - media_type
      properties:
        document_base64:
          type: string
          contentEncoding: base64
          minLength: 4
          description: The document's bytes, standard padded base64 without line breaks. XML at most 5 MiB, a PDF at most 20 MiB decoded.
        media_type:
          type: string
          enum:
          - application/xml
          - text/xml
          - application/pdf
          description: What the document is. The content must agree, or the job is `415 unsupported_content_type`.
        options:
          $ref: '#/components/schemas/ValidationOptions'
  responses:
    InternalError:
      description: Ironfang Finance failed. Not a verdict on anything.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: internal_error
    AdmissionRefused:
      description: The job cannot be validated as asked, for the reasons synchronous validation would refuse it. Nothing was queued or charged.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - unknown_ruleset
                  - selection_conflict
                  - family_undetected
                  - family_mismatch
                  - unsupported_variant
                  - unsupported_document_type
                  - scope_unavailable
                  - no_embedded_invoice
                  - ambiguous_embedded_invoice
                  - encrypted_pdf
                  - processing_limit
    AdmissionGone:
      description: The release was withdrawn from every use, or the billing account is closed. Nothing was queued.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - ruleset_disabled
                  - account_closed
    UnsupportedContentType:
      description: The media type, encoding or content is not accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: unsupported_content_type
    NotFound:
      description: No such release or result is visible.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: not_found
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: rate_limited
    PayloadTooLarge:
      description: The body is over the limit for its media type.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: payload_too_large
    MalformedRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: malformed_request
    ScopeOrEligibility:
      description: The key lacks the scope this operation needs, or paid Ironfang Finance usage needs an approved business and the free allowance is used up. Nothing was accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - insufficient_scope
                  - product_not_eligible
    PaymentRequired:
      description: 'The free allowance is used up and paid usage cannot continue until the billing account is put right: paused, no working payment method, a payment awaiting confirmation, or restricted. Nothing was accepted.'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - paid_usage_paused
                  - payment_required
                  - payment_action_required
                  - account_restricted
    InsufficientScope:
      description: The key lacks the scope this operation needs.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: insufficient_scope
    IdempotencyConflict:
      description: The Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: idempotency_conflict
    Unauthenticated:
      description: The credential is missing or not accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: unauthenticated
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on authenticated requests; scoped to the organisation and this endpoint. The same key with a different request (different bytes, selectors or scope) is `409 idempotency_conflict`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  headers:
    RetryAfter:
      description: Seconds to wait before retrying. Mirrors `retry_after_seconds`.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    platformKey:
      type: http
      scheme: bearer
      description: An Ironfang platform API key minted in the portal, carrying the scopes an operation lists.
externalDocs:
  description: Ironfang Finance documentation
  url: https://ironfang.com/docs/finance
