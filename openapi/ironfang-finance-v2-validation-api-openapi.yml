    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          enum:
          - unknown_field
          - repeated
          - invalid_value
          - missing
        message:
          type: string
          minLength: 1
          maxLength: 256
    Usage:
      type: object
      additionalProperties: false
      required:
      - charged
      - credits
      properties:
        charged:
          type: boolean
        credits:
          type: integer
          minimum: 0
          maximum: 1
        remaining:
          type: integer
          minimum: 0
          description: Only on results recorded before usage billing, returned as they were recorded.
        period_ends_at:
          type: string
          format: date-time
          description: Only on results recorded before usage billing, returned as they were recorded.
    Scope:
      type: string
      enum:
      - xml
      - hybrid_pdf
    RulesetSelector:
      type: string
      pattern: ^(latest|fwrs_[a-z0-9_]{1,80})$
    ValidationVerdict:
      type: object
      description: The result of one completed validation. `outcome` is decided by the fatal findings of the checks that ran, within `coverage`.
      additionalProperties: false
      required:
      - schema
      - status
      - outcome
      - input
      - declared
      - ruleset
      - coverage
      - groups
      - layers
      - counts
      - findings
      - findings_summary
      - timing
      - engines
      - next_actions
      properties:
        schema:
          type: string
          const: ironfang/finance/einvoice/validation-result/v2
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
        status:
          type: string
          const: completed
        outcome:
          type: string
          enum:
          - valid
          - invalid
        input:
          $ref: '#/components/schemas/ValidationInput'
        declared:
          $ref: '#/components/schemas/Declared'
        ruleset:
          $ref: '#/components/schemas/RulesetSelection'
        coverage:
          $ref: '#/components/schemas/Coverage'
        groups:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/CheckGroup'
        layers:
          type: array
          minItems: 3
          maxItems: 9
          items:
            $ref: '#/components/schemas/LayerResult'
        counts:
          type: object
          additionalProperties: false
          required:
          - by_severity
          properties:
            by_severity:
              $ref: '#/components/schemas/SeverityCounts'
        findings:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Finding'
        findings_summary:
          $ref: '#/components/schemas/FindingsSummary'
        timing:
          $ref: '#/components/schemas/Timing'
        engines:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Engine'
        next_actions:
          type: array
          description: 'What this input supports next, from the capability registry: open the readable view, or extract the embedded XML. Never guessed by a client.'
          uniqueItems: true
          items:
            type: string
            enum:
            - view
            - extract_xml
        usage:
          $ref: '#/components/schemas/Usage'
    Timing:
      type: object
      additionalProperties: false
      required:
      - started_at
      - completed_at
      - duration_ms
      properties:
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
          maximum: 30000
    SHA256:
      type: string
      pattern: ^[0-9a-f]{64}$
    ValidationInput:
      type: object
      additionalProperties: false
      required:
      - media_type
      - bytes
      - sha256
      - document_type
      properties:
        media_type:
          type: string
          enum:
          - application/xml
          - application/pdf
        bytes:
          type: integer
          minimum: 0
          maximum: 20971520
        sha256:
          $ref: '#/components/schemas/SHA256'
        document_type:
          type: string
          enum:
          - invoice
          - credit_note
          - unknown
        embedded_xml:
          type: object
          description: For a PDF, the invoice XML exactly as extracted - original bytes, never re-serialised.
          additionalProperties: false
          required:
          - bytes
          - sha256
          properties:
            bytes:
              type: integer
              minimum: 0
              maximum: 5242880
            sha256:
              $ref: '#/components/schemas/SHA256'
            file_name:
              type: string
              maxLength: 128
              description: The attachment's name as declared in the PDF
              for display only.: null
    Layer:
      type: string
      description: A validation stage. A result reports the stages its pipeline runs, in the pipeline's order; no pipeline runs them all.
      enum:
      - input
      - pdfa
      - hybrid_binding
      - xml
      - xsd
      - en16931
      - peppol
      - xrechnung
      - zugferd_profile
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on authenticated requests; scoped to the organisation and this endpoint. The same key with a different request (different bytes, selectors or scope) is `409 idempotency_conflict`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
  responses:
    UnsupportedContentType:
      description: The media type, encoding or content is not accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: unsupported_content_type
    PayloadTooLarge:
      description: The body is over the limit for its media type.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: payload_too_large
    MalformedRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: malformed_request
    ScopeOrEligibility:
      description: The key lacks the scope this operation needs, or paid Ironfang Finance usage needs an approved business and the free allowance is used up. Nothing was accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - insufficient_scope
                  - product_not_eligible
    PaymentRequired:
      description: 'The free allowance is used up and paid usage cannot continue until the billing account is put right: paused, no working payment method, a payment awaiting confirmation, or restricted. Nothing was accepted.'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - paid_usage_paused
                  - payment_required
                  - payment_action_required
                  - account_restricted
    ValidationInternalError:
      description: Ironfang Finance failed while validating. Indeterminate and uncharged.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: internal_error
              required:
              - outcome
              - usage_charged
    IdempotencyConflict:
      description: The Idempotency-Key was used for a different request.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: idempotency_conflict
    Unauthenticated:
      description: The credential is missing or not accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: unauthenticated
  headers:
    XIronfangRequestID:
      description: Ironfang's id for the request, repeated in every Problem as `request_id`.
      schema:
        $ref: '#/components/schemas/RequestID'
    XRequestIDEcho:
      description: Your own well-formed `X-Request-ID` (visible ASCII, 1 to 128 bytes), echoed back.
      required: false
      schema:
        type: string
        pattern: ^[\x21-\x7E]{1,128}$
    RetryAfter:
      description: Seconds to wait before retrying. Mirrors `retry_after_seconds`.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    platformKey:
      type: http
      scheme: bearer
      description: An Ironfang platform API key minted in the portal, carrying the scopes an operation lists.
externalDocs:
  description: Ironfang Finance documentation
  url: https://ironfang.com/docs/finance
