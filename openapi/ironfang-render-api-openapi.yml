openapi: 3.2.0
info:
  title: Ironfang Render API
  version: 1.0.0
  summary: Screenshots, PDFs, dynamic images and video through one API.
  description: Ironfang Render renders web pages to images, PDFs and video.
  contact:
    name: Ironfang
    email: hello@ironfang.uk
    url: https://ironfang.com
  termsOfService: https://ironfang.com/legal/terms
  license:
    name: Proprietary - use governed by the Ironfang terms of service
    url: https://ironfang.com/legal/terms
servers:
- url: https://api.ironfang.com/render
  description: Production
- url: https://api.ironfang.com
  description: Production, unpartitioned - retained for existing clients
security:
- apiKey: []
tags:
- name: Render
  description: Turn a URL or HTML into an image, PDF or video.
paths:
  /v1/screenshot:
    post:
      tags:
      - Render
      summary: Render a screenshot
      description: 'Supply exactly one of `url` or `html`. Returns the image bytes.

        Counts one `render.screenshot`.'
      operationId: createScreenshot
      parameters:
      - $ref: '#/components/parameters/SyncIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenshotRequest'
            examples:
              url:
                summary: A page, full length
                value:
                  url: https://example.com
                  width: 1280
                  full_page: true
              element:
                summary: One element, on a dark-mode page
                value:
                  url: https://example.com/pricing
                  selector: .pricing-table
                  dark_mode: true
              html:
                summary: Your own markup, as JPEG
                value:
                  html: <h1 style="font:600 48px sans-serif">Hello</h1>
                  width: 1200
                  height: 630
                  format: jpeg
                  quality: 85
      responses:
        '200':
          $ref: '#/components/responses/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/RenderFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '402':
          $ref: '#/components/responses/BillingRefused'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/qr:
    post:
      tags:
      - Render
      summary: Render a QR code
      description: 'Styled, optionally logo-bearing QR codes, drawn natively and

        **verified before delivery**: every response is decoded and compared

        to `data` on the way out. A code that would not scan is a

        `422 unscannable` and nothing is counted - the guarantee is the

        feature.


        A logo forces the highest error-correction level and is composited

        over the center on a knockout tile (`logo_pad`). Send it inline as a

        `data:` URI (`logo`) or by URL (`logo_url`); remote logos face the

        same target guard and rate caps as screenshot URLs.


        QRs are deterministic, so identical requests hit the cache and cache

        hits count nothing. Each code counts one `render.qr`, a free utility:

        it shows in usage and is never charged. Output never carries a

        badge - a mark inside a scannable symbol would corrupt it.


        To place a QR inside a stored template render, use the `qr` object

        on `POST /v1/image/{id}` instead - each entry becomes a

        `{{qr.}}` variable holding a data URI.'
      operationId: createQr
      parameters:
      - $ref: '#/components/parameters/SyncIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrRequest'
            examples:
              plain:
                summary: A link, defaults throughout
                value:
                  data: https://example.com/menu
              branded:
                summary: Rounded style with a centered logo
                value:
                  data: https://example.com
                  size: 600
                  dots: circle
                  dark: '#1b2a4a'
                  logo_url: https://example.com/logo.png
                  logo_size: 0.22
      responses:
        '200':
          $ref: '#/components/responses/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/RenderFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '402':
          $ref: '#/components/responses/BillingRefused'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/pdf:
    post:
      tags:
      - Render
      summary: Render a PDF
      description: 'Supply exactly one of `url` or `html`. Returns `application/pdf`.


        `header_html` and `footer_html` are Chromium print templates: they

        support the classes `date`, `title`, `url`, `pageNumber` and

        `totalPages`, which Chromium substitutes at print time.


        Counts one `render.pdf`. A PDF may have at most 100 pages; a document

        that prints to more is refused with `422 pdf_too_long` and nothing is

        counted. PDFs are never cached.'
      operationId: createPdf
      parameters:
      - $ref: '#/components/parameters/SyncIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdfRequest'
            examples:
              invoice:
                summary: An invoice with a page footer
                value:
                  html: <h1>Invoice 1024</h1>
                  print_background: true
                  footer_html: <div style="font-size:9px;margin:0 auto"><span class="pageNumber"></span> of <span class="totalPages"></span></div>
              page:
                summary: A page, landscape
                value:
                  url: https://example.com/report
                  landscape: true
                  print_background: true
      responses:
        '200':
          $ref: '#/components/responses/Pdf'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/RenderFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '402':
          $ref: '#/components/responses/BillingRefused'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
  /v1/video:
    post:
      tags:
      - Render
      summary: Render a clip
      description: 'A background, captions that appear on a schedule, an optional

        watermark and an optional audio bed, encoded to MP4.


        Rendered inside the request, so clips are capped at 60 seconds. A

        clip counts its output seconds, rounded up: `render.video_second_fhd`

        for the 1080p sizes (`vertical`, `landscape`) and

        `render.video_second_hd` for `720p` and `square`. Its duration is

        reserved before the encode and committed when the clip is delivered;

        a clip that fails to render counts nothing.


        Every asset URL is fetched by us through the same guard a screenshot

        target faces, and each is capped at 64 MB.'
      operationId: createClip
      parameters:
      - $ref: '#/components/parameters/SyncIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipRequest'
            examples:
              captioned:
                summary: A captioned vertical clip on a solid colour
                value:
                  size: vertical
                  duration: 15
                  colour: '#101820'
                  captions:
                  - text: Ship it on Friday
                    from: 0
                    to: 5
                  - text: Find out on Monday
                    from: 5
                    to: 10
                  - text: Or gate the deploy
                    from: 10
                    to: 15
              overBackground:
                summary: Over an image, with a logo and music
                value:
                  size: square
                  duration: 20
                  background: https://example.com/backdrop.jpg
                  watermark: https://example.com/logo.png
                  audio: https://example.com/bed.m4a
                  captions:
                  - text: New in August
                    from: 1
                    to: 6
      responses:
        '200':
          $ref: '#/components/responses/Clip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/RenderFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '402':
          $ref: '#/components/responses/BillingRefused'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
        '501':
          description: This deployment has no encoder configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/site-preview:
    post:
      tags:
      - Render
      summary: Render a scrolling website preview
      description: 'Loads and settles a website, preloads lazy content, then records a

        top-to-bottom browser motion at 30 frames per second. `per_page` moves

        one viewport at a time and pauses for 750ms between steps.

        `single_sweep` makes one continuous eased pass. Sticky and fixed

        elements behave as they do in the browser.


        The response is one `multipart/form-data` payload containing the first

        video frame as `poster.jpg` and the H.264 video as `preview.mp4`.

        Ironfang Render calculates the duration from the page height and selected

        motion, up to a 60 second hard limit. A preview counts its output

        seconds, rounded up, against `render.site_preview_second`: the 60

        second limit is reserved before the recording starts and the real

        length is committed when the preview is delivered. Failed work counts

        nothing and cached repeats are free.


        This endpoint is available on the product-partitioned Ironfang Render URL

        only. It has no unprefixed `/v1/site-preview` compatibility route.'
      operationId: createSitePreview
      parameters:
      - $ref: '#/components/parameters/SyncIdempotencyKey'
      servers:
      - url: https://api.ironfang.com/render
        description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SitePreviewRequest'
            examples:
              showcase:
                summary: A showcase card preview
                value:
                  url: https://example.com
                  width: 672
                  height: 494
                  motion: per_page
      responses:
        '200':
          $ref: '#/components/responses/SitePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/RenderFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '402':
          $ref: '#/components/responses/BillingRefused'
        '503':
          $ref: '#/components/responses/BillingUnavailable'
        '501':
          description: This deployment does not have browser video capture configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    Clip:
      description: The rendered clip.
      headers:
        X-Ironfang-Cache:
          schema:
            type: string
            enum:
            - hit
        X-Ironfang-Render-Ms:
          schema:
            type: integer
        X-Ironfang-Meter:
          $ref: '#/components/headers/Meter'
        X-Ironfang-Quantity:
          $ref: '#/components/headers/Quantity'
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    SitePreview:
      description: The poster image and scrolling MP4 returned as two file parts.
      headers:
        X-Ironfang-Cache:
          schema:
            type: string
            enum:
            - hit
        X-Ironfang-Render-Ms:
          schema:
            type: integer
        X-Ironfang-Meter:
          $ref: '#/components/headers/Meter'
        X-Ironfang-Quantity:
          description: 'Output seconds committed, rounded up; the poster is included. `0`

            on a cache hit.

            '
          schema:
            type: integer
        X-Ironfang-Output-Seconds:
          description: Calculated video length in seconds. Present on fresh renders.
          schema:
            type: number
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - poster
            - video
            properties:
              poster:
                type: string
                format: binary
                description: JPEG first frame, suitable for a video poster.
              video:
                type: string
                format: binary
                description: H.264 MP4 with fast-start metadata.
    Pdf:
      description: The rendered PDF.
      headers:
        X-Ironfang-Meter:
          $ref: '#/components/headers/Meter'
        X-Ironfang-Quantity:
          $ref: '#/components/headers/Quantity'
        X-Ironfang-Render-Ms:
          schema:
            type: integer
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    Image:
      description: 'The rendered image. `png` unless `format: jpeg` was requested.

        '
      headers:
        X-Ironfang-Cache:
          description: '`hit` when served from cache, in which case it counted nothing.'
          schema:
            type: string
            enum:
            - hit
        X-Ironfang-Meter:
          $ref: '#/components/headers/Meter'
        X-Ironfang-Quantity:
          $ref: '#/components/headers/Quantity'
        X-Ironfang-Render-Ms:
          description: Render time in milliseconds, excluding any requested delay.
          schema:
            type: integer
        X-Ironfang-Delay-Ms:
          description: The `delay_ms` actually waited, when one was requested.
          schema:
            type: integer
        X-Ironfang-Captured-At:
          description: 'RFC 3339 timestamp of a fresh capture. Present only on

            `no_cache` renders, where the response is also `no-store` - the

            pairing is what makes a capture usable as evidence.

            '
          schema:
            type: string
            format: date-time
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
    Unauthorized:
      description: Missing, malformed, revoked or unknown API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: '`idempotency_key_used` - this Idempotency-Key already made its render

        (or is making it, or failed); nothing was reserved again.

        `idempotency_conflict` - the key was used for a different request.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingRefused:
      description: 'Paid usage cannot be billed: `paid_usage_paused`, `payment_required`,

        `payment_action_required` or `account_restricted`. Resolve it in

        Billing; nothing was reserved or counted. The same body can also

        carry `account_closed` (410) and `operation_too_large` (413).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingUnavailable:
      description: '`billing_temporarily_unavailable` - the billing ledger could not admit

        the request just now. Retry after `Retry-After` seconds; nothing was

        reserved.

        '
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RenderFailed:
      description: 'The page did not render: the host did not resolve, it never finished

        loading, it timed out, or it was blocked. Try `delay_ms`, and check the

        target loads in a normal browser.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`insufficient_scope` - the key does not carry the scope;

        `account_not_linked` - the key''s account belongs to no Ironfang

        organisation, so its usage cannot be billed; `product_not_eligible` -

        paid use of Ironfang Render needs an eligible billing account.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: "Rate limits and exhausted billing allowances share this status,\nseparated by `error.code`:\n\n- `rate_limited` - your account exceeded 120 renders/minute\n- `target_rate_limited` - the site being rendered is being hit too hard\n  across all customers (60/minute per host)\n- `clip_busy`, `preview_busy` - every encoder or preview slot on the\n  worker is in use; `Retry-After` says when to come back\n- `concurrency_limit` - your account already has 2 browser\n  operations in progress, synchronous renders and running jobs\n  together; retry after `Retry-After`, or submit a durable job,\n  which waits for a free slot instead of being refused\n- `queue_full` - your account already has 1,000 unfinished jobs, or\n  the batch would take it past that; nothing was enqueued\n- `free_allowance_exhausted` - this month's free allowance for the\n  meter is used up and paid usage is not enabled\n- `account_budget_exhausted`, `product_budget_exhausted` - the\n  billing account's monthly limit, or Ironfang Render's, is reached\n- `exemption_limit_reached` - an exempt account's agreed limit is reached\n\nThe rate and capacity limits clear by themselves, so retry with\nbackoff, after `Retry-After` where it is sent. The billing codes do\nnot: enable paid usage or raise the limit in Billing, or wait for the\nmonth to roll over. Nothing was reserved or counted. Branch on the\ncode rather than the status.\n"
      headers:
        Retry-After:
          description: Seconds to wait before retrying, on the refusals that clear by themselves.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Malformed body, or neither/both of `url` and `html`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Cookie:
      type: object
      required:
      - name
      - domain
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
          description: 'Required. Chromium silently drops a domainless cookie set before

            navigation, so the render would quietly come back logged out.

            '
        path:
          type: string
          default: /
    ClipRequest:
      type: object
      description: 'Everything is optional. With no background a solid `colour` is used,

        which is what most captioned clips want.

        '
      properties:
        size:
          type: string
          enum:
          - vertical
          - square
          - landscape
          - 720p
          default: vertical
          description: 'vertical 1080x1920, square 1080x1080, landscape 1920x1080,

            720p 1280x720.

            '
        duration:
          type: number
          default: 15
          minimum: 1
          maximum: 60
          description: Seconds of output.
        colour:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          default: '#101820'
          description: Background colour, used when no background asset is given.
        background:
          type: string
          format: uri
          description: An image or video to fill the canvas, cropped to fit.
        watermark:
          type: string
          format: uri
          description: A PNG placed in the bottom right corner.
        audio:
          type: string
          format: uri
          description: An audio track, trimmed to the clip's length.
        font_size:
          type: integer
          minimum: 12
          maximum: 200
          description: Caption size in pixels; defaults to a fifteenth of the width.
        captions:
          type: array
          maxItems: 12
          items:
            type: object
            required:
            - text
            - to
            properties:
              text:
                type: string
                maxLength: 280
              from:
                type: number
                description: Seconds from the start.
              to:
                type: number
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable, safe to branch on. New codes may be added: treat a

                code you do not recognise as a failure of the class its HTTP

                status indicates.

                '
              enum:
              - bad_request
              - unauthorized
              - invalid_api_key
              - auth_failed
              - forbidden
              - billing_moved
              - not_found
              - rate_limited
              - target_rate_limited
              - render_failed
              - bad_signature
              - signing_disabled
              - account_gone
              - account_not_linked
              - account_required
              - admission_failed
              - bad_destination
              - bad_target
              - batch_plan_failed
              - batch_submit_failed
              - batch_too_large
              - bundle_failed
              - clip_busy
              - concurrency_limit
              - delegated_not_allowed
              - delivery_disabled
              - delivery_plan_failed
              - destination_disabled
              - idempotency_conflict
              - idempotency_key_used
              - insufficient_scope
              - invalid_token
              - job_finished
              - job_plan_failed
              - job_submit_failed
              - logo_fetch_failed
              - pdf_too_long
              - preview_busy
              - queue_full
              - result_expired
              - result_not_ready
              - result_read_failed
              - secret_failed
              - site_preview_disabled
              - store_failed
              - unknown_destination
              - unscannable
              - vault_failed
              - video_disabled
              - free_allowance_exhausted
              - account_budget_exhausted
              - product_budget_exhausted
              - paid_usage_paused
              - payment_required
              - payment_action_required
              - account_restricted
              - account_closed
              - product_not_eligible
              - exemption_limit_reached
              - operation_too_large
              - billing_temporarily_unavailable
            message:
              type: string
              description: Human-readable. May change; do not match on it.
            docs:
              type: string
              format: uri
              description: Where the error codes are documented.
        request_id:
          type: string
          description: The X-Ironfang-Request-ID of the failed request. Quote it to support.
      example:
        error:
          code: target_rate_limited
          message: too many renders for that host, try again shortly
          docs: https://ironfang.com/render/docs#errors
        request_id: 01992f6e-7c1a-7b3e-9d52-4f0a6c8e2b17
    PdfRequest:
      allOf:
      - $ref: '#/components/schemas/RenderCommon'
      - type: object
        properties:
          url:
            type: string
            format: uri
            description: Page to print. Mutually exclusive with `html`.
          html:
            type: string
            description: Markup to print. Mutually exclusive with `url`.
          landscape:
            type: boolean
            default: false
          paper_format:
            type: string
            enum:
            - a3
            - a4
            - a5
            - letter
            - legal
            - tabloid
            description: 'Named page size. Omit for Chromium''s default, which is Letter.

              Sizes are portrait; `landscape` rotates them.

              '
          margin:
            $ref: '#/components/schemas/Margin'
          print_background:
            type: boolean
            default: false
            description: 'Include background colours and images. Off by default, matching

              a browser''s print dialog.

              '
          header_html:
            type: string
            description: Chromium print header template.
          footer_html:
            type: string
            description: Chromium print footer template.
          scale:
            type: number
            description: Print scale. Omit or `0` for 1.0.
    SitePreviewRequest:
      allOf:
      - $ref: '#/components/schemas/RenderCommon'
      - type: object
        required:
        - url
        properties:
          url:
            type: string
            format: uri
            description: Public HTTP or HTTPS page to record.
          width:
            type: integer
            default: 672
            minimum: 320
            maximum: 1280
            multipleOf: 2
            description: Output and browser viewport width in pixels.
          height:
            type: integer
            default: 494
            minimum: 240
            maximum: 1200
            multipleOf: 2
            description: 'Output and browser viewport height in pixels. Width multiplied

              by height cannot exceed 1,200,000 pixels.

              '
          motion:
            type: string
            enum:
            - per_page
            - single_sweep
            default: per_page
            description: '`per_page` moves one viewport at a time with eased transitions

              and a 750ms reading pause. `single_sweep` makes one

              continuous eased pass from top to bottom.

              '
          dark_mode:
            type: boolean
            default: false
            description: 'Record with `prefers-color-scheme: dark`.'
          device:
            type: string
            enum:
            - desktop
            - tablet
            - mobile
            description: 'Use a full device preset. Explicit width and height still win.

              '
          delay_ms:
            type: integer
            minimum: 0
            maximum: 10000
            description: Extra settle time after page load and before lazy-content preloading. Capped at ten seconds.
          no_cache:
            type: boolean
            default: false
            description: Force a fresh recording instead of using a cached result.
    Clip:
      type: object
      description: A rectangle in CSS pixels from the top left of the page.
      required:
      - width
      - height
      properties:
        x:
          type: number
          default: 0
        y:
          type: number
          default: 0
        width:
          type: number
          maximum: 4096
        height:
          type: number
          maximum: 4096
    Margin:
      type: object
      description: 'Page margins in inches. Omitted sides keep Chromium''s default rather

        than becoming zero - a PDF printed hard to the paper edge is rarely

        what leaving a field out was meant to mean.

        '
      properties:
        top:
          type: number
        right:
          type: number
        bottom:
          type: number
        left:
          type: number
    ScreenshotRequest:
      allOf:
      - $ref: '#/components/schemas/RenderCommon'
      - type: object
        properties:
          url:
            type: string
            format: uri
            description: Page to capture. Mutually exclusive with `html`.
          html:
            type: string
            description: Markup to render. Mutually exclusive with `url`.
          width:
            type: integer
            default: 1280
            maximum: 4096
            description: Viewport width in pixels.
          height:
            type: integer
            default: 800
            maximum: 4096
            description: Viewport height. Ignored when `full_page` is set.
          full_page:
            type: boolean
            default: false
            description: Capture the whole scrollable page.
          selector:
            type: string
            description: 'CSS selector of a single element to capture instead of the

              viewport.

              '
          clip:
            $ref: '#/components/schemas/Clip'
          omit_background:
            type: boolean
            default: false
            description: 'Transparent background instead of the page''s own. Ignored for

              `jpeg`, which has no alpha channel.

              '
          full_page_max_height:
            type: integer
            default: 20000
            maximum: 20000
            description: 'Cap a `full_page` capture at this many pixels. An

              infinite-scroll page has no natural end, so 20000 applies when

              none is given, and is also the most that can be asked for.

              '
          dark_mode:
            type: boolean
            default: false
            description: 'Render with `prefers-color-scheme: dark`.'
          format:
            type: string
            enum:
            - png
            - jpeg
            - webp
            default: png
            description: 'PNG is lossless and the default. WebP is typically a fraction of

              the size for the same picture, which is what matters when the

              output is served to browsers or social crawlers.

              '
          quality:
            type: integer
            minimum: 1
            maximum: 100
            default: 85
            description: Quality for the lossy formats, `jpeg` and `webp`. Ignored for PNG.
          device:
            type: string
            enum:
            - desktop
            - tablet
            - mobile
            description: 'Capture as a phone or tablet rather than a desktop window that

              happens to be narrow. Sets the viewport, the device pixel ratio,

              touch, and a matching mobile user agent together - width alone

              gets media queries right and everything else wrong.


              An explicit `width` or `height` still wins, so a preset can be

              used for the density and user agent while overriding the size.

              '
          delay_ms:
            type: integer
            minimum: 0
            maximum: 10000
            description: 'Extra settle time after load. Ironfang Render watches the page and

              captures when it stops changing, so this is rarely needed - use

              it for content that arrives on a timer, which quiescence cannot

              anticipate. Capped at ten seconds.

              '
    QrRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: string
          maxLength: 1024
          description: The payload - a URL, WiFi string, or any text up to 1KB.
        size:
          type: integer
          default: 512
          minimum: 64
          maximum: 2048
          description: Output side in pixels. Output is always square PNG.
        ecc:
          type: string
          enum:
          - L
          - M
          - Q
          - H
          default: M
          description: 'Error-correction level. Forced to `H` when a logo is present -

            the logo destroys the modules it covers, and that budget has to

            come from somewhere.

            '
        dark:
          type: string
          default: '#000000'
          description: Module color, `#rgb` or `#rrggbb`. Must actually be darker than `light`.
        light:
          type: string
          default: '#ffffff'
          description: 'Background color, or `transparent`. Transparent codes are

            verified against a white ground - place them on light surfaces.

            '
        dots:
          type: string
          enum:
          - square
          - circle
          default: square
          description: 'Module style. `circle` draws separated dots. Finder patterns

            always render solid - styled finders are how QR generators

            produce codes that do not scan.

            '
        eyes:
          type: string
          enum:
          - square
          - rounded
          description: Finder-pattern style. Defaults to match `dots`.
        margin:
          type: integer
          default: 4
          minimum: 0
          maximum: 8
          description: Quiet zone, in modules.
        invert:
          type: boolean
          default: false
          description: 'Light modules on a dark ground. Explicit because it narrows the

            audience: modern phone cameras read inverted codes, many

            embedded and in-app scanners do not - use it for screens, not

            print or payments. With the flag set, `dark` (the module color)

            must be lighter than `light` (the ground). Verified against the

            negative, so the structural guarantee holds.

            '
        logo:
          type: string
          description: 'Center mark as a base64 `data:` URI, png or jpeg, up to 1MB

            decoded. Mutually exclusive with `logo_url`.

            '
        logo_url:
          type: string
          format: uri
          description: Center mark by URL. SSRF-guarded and rate-capped like a render target.
        logo_size:
          type: number
          default: 0.22
          minimum: 0.12
          maximum: 0.3
          description: Logo tile as a fraction of the symbol width.
        logo_pad:
          type: boolean
          default: true
          description: Knockout tile behind the logo so it sits on clean ground.
    PageAction:
      description: 'One ordered pre-capture action. Selectors are CSS selectors in the main

        page. click and hover wait until the first matching element is

        interactable; wait_for_selector waits for its presence (not visibility).

        All actions share the remaining timeout_ms render budget.

        '
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - selector
        properties:
          type:
            type: string
            enum:
            - click
            - hover
            - wait_for_selector
          selector:
            type: string
            minLength: 1
            maxLength: 1024
            description: Non-blank CSS selector; at most 1024 UTF-8 bytes.
      - type: object
        additionalProperties: false
        required:
        - type
        - duration_ms
        properties:
          type:
            type: string
            enum:
            - delay
          duration_ms:
            type: integer
            minimum: 0
            maximum: 10000
            description: Delay in milliseconds; all action delays together may total at most 10000 ms.
    RenderCommon:
      type: object
      properties:
        no_cache:
          type: boolean
          default: false
          description: 'Force a fresh render instead of serving a cached one. Always

            billable. Excluded from the cache key, so repeated fresh requests

            do not collide.

            '
        block_ads:
          type: boolean
          default: false
          description: 'Drop requests to known ad and tracker networks before they load.

            Stopped as network requests rather than hidden afterwards, so the

            page never spends time fetching them.

            '
        block_cookie_banners:
          type: boolean
          default: false
          description: 'Hide common consent banners, and undo the scroll lock they set -

            without which a full-page capture is one viewport tall.


            Hidden, not accepted. Clicking "accept" would be a decision made

            on the site owner''s behalf and recorded as theirs.

            '
        hide_selectors:
          type: array
          items:
            type: string
          description: 'CSS selectors to hide before capturing. Applied after load, so

            elements injected by script are covered.

            '
        css:
          type: string
          maxLength: 65536
          example: '.chat-widget { display: none !important; }'
          description: 'Custom stylesheet, at most 65536 UTF-8 bytes. Applied after normal

            load/wait conditions and built-in hiding, before script, actions,

            settling and capture. Supports screenshots and PDFs, including

            @media print rules. Malformed stylesheet syntax is a 400

            bad_request; Chromium determines supported properties and values.

            '
        script:
          type: string
          maxLength: 16384
          example: document.querySelector('#pricing')?.click();
          description: 'JavaScript statements executed inside the target page''s main-frame

            context after load/wait conditions and css, before actions and

            capture. Runs as an async function body: use await or return a

            promise for asynchronous work. Completion is awaited; return values

            are discarded. At most 16384 UTF-8 bytes and 5000 ms execution,

            further bounded by the remaining timeout_ms budget. Syntax errors,

            execution failures and timeouts return 422 render_failed with a

            sanitized message. Supports screenshots and PDFs; no browser-session

            or Playwright/Puppeteer APIs are exposed.

            '
        actions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PageAction'
          example:
          - type: click
            selector: '#show-more'
          - type: wait_for_selector
            selector: '#details'
          description: 'Up to 20 actions, executed in order after css and script, before

            settling and capture. Supports screenshots and PDFs. Missing or

            unready selectors and action timeouts fail with 422 render_failed,

            identifying the zero-based action index and type. Invalid action

            shapes are 400 bad_request. An action failure stops the list and is

            not retried in queued jobs. All options, including action order,

            are part of the screenshot cache key; use no_cache for a fresh run.

            '
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra HTTP headers sent with every request for the page.
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/Cookie'
          description: 'Cookies to set before navigating. Set beforehand because a session

            cookie that arrives after load has missed the request it was meant

            to authenticate.

            '
        authorization:
          type: string
          description: 'Sets the `Authorization` header - the common case, spelled once.

            An explicit `Authorization` in `headers` wins over this.

            '
        user_agent:
          type: string
          description: 'Overrides the user agent, including any set by `device`.

            '
        wait_until:
          type: string
          enum:
          - load
          - domcontentloaded
          - networkidle
          default: load
          description: 'When the page counts as ready. `networkidle` waits for traffic to

            stop and is bounded by the render timeout, because a page with

            polling never truly idles.

            '
        wait_for_selector:
          type: string
          description: 'Wait for this element before capturing. Fails the render if it

            never appears, rather than returning a half-drawn page.

            '
        timeout_ms:
          type: integer
          description: 'Per-render timeout. Clamped to the service maximum - it can lower

            the ceiling but not raise it.

            '
        device_scale_factor:
          type: number
          minimum: 1
          maximum: 3
          description: 'Pixel density. 2 is retina: the same CSS size at twice the pixels.

            '
  headers:
    Quantity:
      description: 'The quantity this request committed to its meter: 1 for a unit

        render, output seconds (rounded up) for video, `0` for a cache hit or

        an unmetered key. Read it to log usage per request without polling

        `/v1/usage`.

        '
      schema:
        type: integer
    Meter:
      description: 'The billing meter this request counted against, e.g.

        `render.screenshot`. Present on every billable response, cache hits

        included.

        '
      schema:
        type: string
  parameters:
    SyncIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Makes a synchronous render happen, and count, at most once. Any string

        up to 255 characters, remembered per account. The first request under

        a key is admitted and rendered as usual; a synchronous result is not

        kept, so the same request again under the key is a `409

        idempotency_key_used` and reserves nothing - send a new key to render

        again. A different request under a used key is a `409

        idempotency_conflict`. An identical request inside the cache window is

        still served from cache.

        '
      schema:
        type: string
        maxLength: 255
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'An API key from the portal, sent as `Authorization: Bearer rw_live_...`.

        '
externalDocs:
  description: Ironfang Render documentation
  url: https://ironfang.com/render/docs
