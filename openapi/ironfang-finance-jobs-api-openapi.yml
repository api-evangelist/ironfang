openapi: 3.2.0
info:
  title: Ironfang Finance E-Invoicing Jobs API
  version: 1.4.0
  summary: Generate UBL invoices and validate Invoice or CreditNote XML with PHIVE.
  description: 'Ironfang Finance validates UBL e-invoices against the exact EN 16931 and Peppol

    BIS Billing rule releases published by the standards bodies, and returns a

    result that names the immutable ruleset it used so the outcome can be

    reproduced later.'
  contact:
    name: Ironfang
    email: hello@ironfang.uk
    url: https://ironfang.com/finance
  termsOfService: https://ironfang.com/legal/terms
  license:
    name: Proprietary
    identifier: LicenseRef-Ironfang-Proprietary
servers:
- url: https://api.ironfang.com/finance
  description: Production. Paths below are relative to this product prefix.
security:
- {}
- platformKey: []
tags:
- name: Jobs
  description: Authenticated durable validation and generation jobs and ordered batches.
paths:
  /v1/einvoices/jobs:
    get:
      operationId: listEinvoiceJobs
      summary: List jobs
      description: Tenant-scoped metadata, newest first by creation time and ID. Equal timestamps retain stable pagination. Newer insertions do not appear on subsequent pages; refresh the first page to see them. No input payloads or child job bodies in batch summaries. A final page has an empty next_cursor. Responses are no-store. The JWT portal twin has the same response and pagination contract. Only V1 jobs and batches are listed, read or cancelled here; one made through /finance/v2 is not found, and V2 lists both at /finance/v2/einvoices/jobs and /finance/v2/einvoices/batches.
      tags:
      - Jobs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
        description: Pass next_cursor from the preceding page; empty means the first page.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
      responses:
        '200':
          description: One bounded page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
      security:
      - platformKey: []
      x-ironfang-scopes:
      - finance:einvoices:read
    post:
      operationId: createEinvoiceJob
      summary: Create an async job
      description: 'Accept work durably using finance:einvoices:write. Jobs pin the selected

        ruleset and engine at acceptance and use the same PHIVE/generator path as synchronous

        requests. A batch has 1-100 ordered jobs; admission is atomic. Each input is at most

        5 MiB; JSON envelopes are limited to 8 MiB for a job and 32 MiB for a batch. The tenant

        backlog is limited to 100 unfinished jobs and 25 MiB of original inputs across keys.

        At most two jobs run per tenant across replicas. At most two admission envelopes are buffered per API process; excess returns 429. Encrypted inputs expire after 24 hours

        and are erased on completion or cancellation. Lease recovery and transient dependency

        failures allow up to three attempts, with 5/10-second retry delays; attempts never add

        extra usage charges. Caller disconnection does not cancel accepted work. Use an

        Idempotency-Key (8-128 letters, digits, underscore or hyphen) when retrying an uncertain

        admission. An identical request returns 200 current metadata; a different request under

        the same key returns 409. Do not put invoice values in keys. Admission requires a

        configured queue encryption key; polling, cancellation and replays remain available

        when new admission is disabled. No query parameters or remote input URLs are accepted.

        All responses are no-store.'
      tags:
      - Jobs
      security:
      - platformKey: []
      x-ironfang-scopes:
      - finance:einvoices:write
      responses:
        '202':
          description: Accepted durably; no validation outcome yet.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
            Location:
              description: Relative polling URL.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '200':
          description: Current metadata for an idempotent replay.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/ScopeOrEligibility'
        '429':
          description: Rate limit, tenant backlog limit (`quota_exhausted`; retry after work finishes or is cancelled), or the billing account can admit no more of this work this month.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - rate_limited
                      - quota_exhausted
                      - free_allowance_exhausted
                      - account_budget_exhausted
                      - product_budget_exhausted
                      - exemption_limit_reached
                    status:
                      const: 429
                  not:
                    anyOf:
                    - required:
                      - outcome
                    - required:
                      - usage_charged
                    - required:
                      - operation_id
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '410':
          $ref: '#/components/responses/AdmissionGone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/UnsupportedSelection'
        '503':
          description: New async admission unavailable, or billing briefly unavailable; retry with the same Idempotency-Key. Existing metadata remains readable.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - jobs_unavailable
                      - billing_temporarily_unavailable
                    status:
                      const: 503
                  not:
                    anyOf:
                    - required:
                      - outcome
                    - required:
                      - usage_charged
                    - required:
                      - operation_id
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
  /v1/einvoices/jobs/{id}:
    get:
      operationId: getEinvoiceJob
      summary: Get an async job
      description: 'Read tenant-owned job metadata with finance:einvoices:read. Unknown or foreign IDs

        return 404. Queued/running usage_charged=false is the current ledger state, not a promise

        that completed work is free. A completed validation may be valid or invalid; service

        failures are failed/indeterminate and uncharged. Use operation_id at /results/{id} for

        the exact saved result (30-day retention). Batch children remain ordered by position;

        completed children are readable before the whole batch finishes. Mixed terminal

        statuses produce partial. Metadata contains no input, credentials or lease token.

        No query parameters are accepted; responses are no-store.'
      tags:
      - Jobs
      security:
      - platformKey: []
      x-ironfang-scopes:
      - finance:einvoices:read
      responses:
        '200':
          description: Current metadata.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueID'
  /v1/einvoices/jobs/{id}/cancel:
    post:
      operationId: cancelEinvoiceJob
      summary: Cancel an async job
      description: 'Cancel unfinished tenant-owned work with finance:einvoices:write. Send an empty body

        and no query parameters. Cancellation and completion are serialized: a completed job

        keeps its result and usage; cancellation that wins prevents any later result or charge

        and erases the queued input. Repeated cancellation is idempotent. Batch cancellation

        preserves terminal children and cancels only queued/running children, atomically.

        Unknown or foreign IDs return 404. Responses are no-store.'
      tags:
      - Jobs
      security:
      - platformKey: []
      x-ironfang-scopes:
      - finance:einvoices:write
      responses:
        '200':
          description: Current metadata.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueID'
  /v1/einvoices/batches:
