        backlog is limited to 100 unfinished jobs and 25 MiB of original inputs across keys.

        At most two jobs run per tenant across replicas. At most two admission envelopes are buffered per API process; excess returns 429. Encrypted inputs expire after 24 hours

        and are erased on completion or cancellation. Lease recovery and transient dependency

