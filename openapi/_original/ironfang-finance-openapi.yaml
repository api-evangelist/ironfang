          - account
        else:
          not:
            required:
            - account
    GenerationDefReference:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/GenerationDefId'
        issue_date:
          $ref: '#/components/schemas/GenerationDefDate'
