    RenderRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
    GenerationRequest:
      title: Ironfang Finance e-invoice generation input v1
      description: Deterministic UBL 2.1 Invoice (380) or CreditNote (381) input. Schema validation does not
        assert Peppol validity. Decimal strings are exact; amount reconciliation is an additional generator
        check.
      type: object
      additionalProperties: false
      properties:
        input_schema_version:
          const: financewolf/einvoice/generation-input/v1
        document_type:
          enum:
          - invoice
          - credit_note
        id:
          $ref: '#/components/schemas/GenerationDefId'
        issue_date:
          $ref: '#/components/schemas/GenerationDefDate'
        due_date:
          $ref: '#/components/schemas/GenerationDefDate'
        tax_point_date:
          $ref: '#/components/schemas/GenerationDefDate'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        buyer_reference:
          $ref: '#/components/schemas/GenerationDefId'
        purchase_order_reference:
          $ref: '#/components/schemas/GenerationDefId'
        contract_reference:
          $ref: '#/components/schemas/GenerationDefId'
        preceding_invoices:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefReference'
          minItems: 1
          maxItems: 100
        seller:
          $ref: '#/components/schemas/GenerationDefParty'
        buyer:
          $ref: '#/components/schemas/GenerationDefParty'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefLine'
          minItems: 1
          maxItems: 2000
        allowances:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefDocumentAdjustment'
          minItems: 1
          maxItems: 100
        charges:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefDocumentAdjustment'
          minItems: 1
          maxItems: 100
        payment:
          $ref: '#/components/schemas/GenerationDefPayment'
        payment_terms:
          $ref: '#/components/schemas/GenerationDefText'
        delivery:
          $ref: '#/components/schemas/GenerationDefDelivery'
        note:
          $ref: '#/components/schemas/GenerationDefNote'
        accounting_cost:
          $ref: '#/components/schemas/GenerationDefId'
        prepaid_amount:
          $ref: '#/components/schemas/GenerationDefUnsignedAmount'
        rounding_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        totals:
          $ref: '#/components/schemas/GenerationDefTotals'
        tax_subtotals:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefTaxSubtotal'
          minItems: 1
          maxItems: 100
      required:
      - input_schema_version
      - document_type
      - id
      - issue_date
      - currency
      - seller
      - buyer
      - lines
      anyOf:
      - required:
        - buyer_reference
      - required:
        - purchase_order_reference
      allOf:
      - if:
          properties:
            document_type:
              const: credit_note
        then:
          not:
            required:
            - due_date
    GenerationDefId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[^\0-\b\v\f\x0E-\x1F\uFFFD-\uFFFF]*$"
      allOf:
      - pattern: \S
      - pattern: ^\S(?:[\s\S]*\S)?$
    GenerationDefText:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "^[^\0-\b\v\f\x0E-\x1F\uFFFD-\uFFFF]*$"
      allOf:
      - pattern: \S
    GenerationDefName:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[^\0-\b\v\f\x0E-\x1F\uFFFD-\uFFFF]*$"
      allOf:
      - pattern: \S
    GenerationDefNote:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: "^[^\0-\b\v\f\x0E-\x1F\uFFFD-\uFFFF]*$"
      allOf:
      - pattern: \S
    GenerationDefAmount:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,2})?$
      maxLength: 23
    GenerationDefUnsignedAmount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,2})?$
      maxLength: 23
    GenerationDefDecimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,6})?$
      maxLength: 23
    GenerationDefUnsignedDecimal:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})(\.[0-9]{1,6})?$
      maxLength: 23
    GenerationDefDate:
      type: string
      format: date
      pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$
    GenerationDefCountry:
      type: string
      pattern: ^[A-Z]{2}$
    GenerationDefIdentifier:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/GenerationDefId'
        scheme:
          type: string
          pattern: ^[A-Za-z0-9-]{1,16}$
      required:
      - value
    GenerationDefEndpoint:
      type: object
      additionalProperties: false
      properties:
        value:
