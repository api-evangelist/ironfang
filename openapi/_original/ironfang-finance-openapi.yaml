      - date
      - address
    GenerationDefTotals:
      type: object
      additionalProperties: false
      properties:
        line_net_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        allowance_total:
          $ref: '#/components/schemas/GenerationDefAmount'
        charge_total:
          $ref: '#/components/schemas/GenerationDefAmount'
        tax_exclusive_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        tax_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        tax_inclusive_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        prepaid_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        rounding_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        payable_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
      required:
      - line_net_amount
      - allowance_total
      - charge_total
      - tax_exclusive_amount
      - tax_amount
      - tax_inclusive_amount
      - prepaid_amount
      - rounding_amount
      - payable_amount
    GenerationDefTaxSubtotal:
      type: object
      additionalProperties: false
      properties:
        tax:
          $ref: '#/components/schemas/GenerationDefTax'
        taxable_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
        tax_amount:
          $ref: '#/components/schemas/GenerationDefAmount'
      required:
      - tax
      - taxable_amount
      - tax_amount
    GenerationResult:
      type: object
      additionalProperties: false
      required:
      - schema
      - status
      - outcome
      - input
      - generator
      - artifact
      - validation
      properties:
        schema:
          type: string
          const: financewolf/einvoice/generation-result/v1
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
        status:
          type: string
          const: completed
        outcome:
          type: string
          const: valid
        input:
          type: object
          additionalProperties: false
          required:
          - sha256
          - bytes
          - content_type
          - document_type
          - canonicalization
          - schema_version
          properties:
            sha256:
              $ref: '#/components/schemas/SHA256'
              description: SHA-256 of the exact bytes received.
            bytes:
              type: integer
              minimum: 0
              maximum: 31457280
            content_type:
              type: string
              const: application/json
            document_type:
              type: string
              enum:
              - invoice
              - credit_note
            canonicalization:
              type: string
              const: financewolf-json/1
            schema_version:
              type: string
              const: financewolf/einvoice/generation-input/v1
        generator:
          type: object
          additionalProperties: false
          required:
          - version
          - layer
          - status
          properties:
            version:
              type: string
              pattern: ^financewolf-ubl/[0-9]+[.][0-9]+[.][0-9]+$
            layer:
              type: string
              const: generator
            status:
              type: string
              const: passed
        artifact:
          type: object
          additionalProperties: false
          required:
          - content_type
          - sha256
          - bytes
          - data_base64
          properties:
            content_type:
              type: string
              const: application/xml
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
            bytes:
              type: integer
              minimum: 1
              maximum: 5242880
            data_base64:
              type: string
              contentEncoding: base64
              minLength: 4
              maxLength: 6990508
              pattern: ^[A-Za-z0-9+/]+={0,2}$
        validation:
          allOf:
          - $ref: '#/components/schemas/ValidationVerdict'
          - properties:
              outcome:
                type: string
                const: valid
              layers:
                items:
                  properties:
                    status:
                      type: string
                      const: passed
              profile:
                properties:
                  source:
                    type: string
                    const: requested
        usage:
          $ref: '#/components/schemas/Usage'
      dependentRequired:
        operation_id:
        - usage
        usage:
        - operation_id
    RetainedResultList:
      type: object
      additionalProperties: false
      required:
      - results
      - retention_days
      - total
      properties:
        retention_days:
          type: integer
          const: 30
        total:
          type: integer
          format: int64
          minimum: 0
          description: All matching metadata records, including expired/deleted results, independent of cursor.
        next_cursor:
          type: string
          minLength: 1
          maxLength: 256
        results:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - operation_id
            - outcome
            - ruleset_id
            - created_at
            - expires_at
            - available
            properties:
              display_name:
                type: string
                maxLength: 255
                description: Optional portal filename; removed with the hosted result.
              kind:
                type: string
                enum: [validate, generate]
              operation_id:
                $ref: '#/components/schemas/OpaqueID'
              outcome:
                type: string
                enum:
                - valid
                - invalid
              ruleset_id:
                type: string
                pattern: ^fwrs_[a-z0-9_]{1,80}$
              created_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
              deleted_at:
                type: string
                format: date-time
              available:
                type: boolean
    # ------------------------------------------------------------------ scalars
    XMLDocument:
      type: string
      contentMediaType: application/xml
      description: A UBL 2.1 Invoice or CreditNote document, at most 5 MiB.
      maxLength: 5242880

    RulesetID:
      type: string
      description: An immutable ruleset identifier. Never reused, never edited.
      pattern: '^fwrs_[a-z0-9_]{1,80}$'

    RulesetSelector:
      type: string
      description: "`latest`, or an exact ruleset id in any validatable state."
      default: latest
      pattern: '^(latest|fwrs_[a-z0-9_]{1,80})$'

    OpaqueID:
      type: string
      description: An opaque Ironfang identifier.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'

    RequestID:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'

    SHA256:
      type: string
      description: Lowercase hex SHA-256.
      pattern: '^[0-9a-f]{64}$'

    ImageDigest:
      type: string
      description: The pinned validator engine image, as a sha256 digest.
      pattern: '^sha256:[0-9a-f]{64}$'

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.

    HTTPSURL:
      type: string
      format: uri
      description: >-
        A provenance URL under one narrow grammar: https, a lowercase DNS
        host of at least two labels, no userinfo, no IP literal, an optional
        port 1..65535, an optional path, query and fragment of unreserved and
        sub-delimiter characters or valid percent-escapes, no whitespace. The
        same expression is held by the registry review, the database and
        this document.
      pattern: '^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*\.[a-z]([a-z0-9-]{0,61}[a-z0-9])?(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(/([A-Za-z0-9._~!$&()*+,;=:@/-]|%[0-9A-Fa-f]{2})*)?(\?([A-Za-z0-9._~!$&()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?(#([A-Za-z0-9._~!$&()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?$'

    FindingMessage:
      type: string
      description: >-
        One of Ironfang's fixed finding messages, selected by the finding's
        rule id (for the validator's own FW-* rules) or by its layer. No
        message text from the validation engine or a rule set is ever
        returned: the rule id and the sanitised location carry the detail.
        The union below is exactly the closed catalogue
        (services/finance-validator/corpus/finding-messages.json); a
        result carrying any other message is refused before it is stored or
        written.
      enum:
        - "A Peppol BIS Billing 3.0 rule failed at this location."
        - "An EN 16931 business rule failed at this location."
        - "The document could not be read as XML within the contract limits."
        - "The document does not conform to the UBL 2.1 schema at this location."
        - "The document encoding, declaration or structure is not accepted."
        - "The document has more elements than the contract limit of 250,000."
        - "The document nests elements deeper than the contract limit of 64."
        - "The input is empty or larger than the contract limit of 5,242,880 bytes."
        - "The input was refused by the contract limits before parsing."

    DocumentType:
      type: string
      enum: [invoice, credit_note]

    DocumentTypeSelector:
      type: string
      enum: [invoice, credit_note, auto]
      default: auto

    ProfileFamily:
      type: string
      description: A supported profile family. V1 supports Peppol BIS Billing 3.
      enum: [peppol-bis-billing-3]

    RulesetState:
      type: string
      description: >-
        Public lifecycle state of a release that may be validated against.
        `sendable` is current and is what `latest` resolves to; `scheduled`
        is the next release, not yet in force, validatable for migration
        testing; `historical` has been superseded but stays validatable for
        reproduction. Withdrawn (`disabled`) releases answer `410` and never
        appear in a body; candidate releases are internal and never appear.
      enum: [scheduled, sendable, historical]

    Layer:
      type: string
      description: A validation layer, in execution order.
      enum: [input, xml, xsd, en16931, peppol]

    LayerStatus:
      type: string
      enum: [passed, failed, skipped, error]

    LayerReason:
      type: string
      description: >-
        Why a layer did not run to a verdict. `skipped_after_failure`: an
        earlier layer failed and this one cannot execute safely.
        `not_applicable`: the layer does not exist for the selected profile.
        `engine_error`: the validator failed inside this layer.
        `deadline_exceeded`: the deadline passed during this layer.
      enum: [skipped_after_failure, not_applicable, engine_error, deadline_exceeded]

    Severity:
      type: string
      description: "`fatal` findings make the document invalid; `warning` findings never do and are never promoted."
      enum: [fatal, warning]

    Outcome:
      type: string
      description: >-
        The standard's verdict. `indeterminate` means Ironfang Finance could not
        decide; it is never converted to `invalid` and never billed.
      enum: [valid, invalid, indeterminate]

    OperationStatus:
      type: string
      description: How far execution got, independent of the verdict.
      enum: [completed, error]

    SelectionMethod:
      type: string
      description: >-
        How the ruleset was chosen: `exact` (the request named the id),
        `latest` (resolved from the requested profile), `detected` (profile
        detected from the document, then resolved as latest).
      enum: [exact, latest, detected]

    LocationKind:
      type: string
      description: "The vocabulary the validator and the findings store use: `none`, `xpath`, or `line-column`."
      enum: [none, xpath, line-column]

    LicenceStatus:
      type: string
      description: >-
        Ironfang's licence review of a rule artefact: `permissive`,
        `notice-required` (attribution travels with derived output), or
        `no-raw-redistribution` (Ironfang Finance executes it; raw files are not
        served).
      enum: [permissive, notice-required, no-raw-redistribution]

    # ---------------------------------------------------------------- request
    ValidationOptions:
      type: object
      description: >-
        Options for the multipart form. Unknown fields are rejected so a
        misspelt option cannot silently fall back to a default.
      additionalProperties: false
      properties:
        ruleset:
          $ref: '#/components/schemas/RulesetSelector'
        profile:
          $ref: '#/components/schemas/ProfileFamily'
        document_type:
          $ref: '#/components/schemas/DocumentTypeSelector'

    # ----------------------------------------------------------------- result
    ValidationResult:
      type: object
      description: >-
        The general result model: what a validation produced, whether or
        not it reached a verdict. Retained deliberately broad so a stored
        or asynchronous operation (later slices) can represent an
        indeterminate run. The synchronous `200` response uses the
        narrower `ValidationVerdict`.
      additionalProperties: false
      required:
        - schema
        - status
        - outcome
        - input
        - ruleset
        - profile
        - layers
        - counts
        - findings
        - findings_summary
        - timing
        - engine
      properties:
        schema:
          type: string
          description: The version of this result document.
          const: financewolf/einvoice/validation-result/v1
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
          description: Present for authenticated requests, which create an operation record. Absent for anonymous validation.
        document_id:
          $ref: '#/components/schemas/OpaqueID'
          description: Present when the authenticated organisation's retention policy stored the document. Absent otherwise.
        status:
          $ref: '#/components/schemas/OperationStatus'
        outcome:
          $ref: '#/components/schemas/Outcome'
        input:
          $ref: '#/components/schemas/ValidationInput'
        ruleset:
          $ref: '#/components/schemas/RulesetSelection'
        profile:
          $ref: '#/components/schemas/ProfileDetection'
        layers:
          type: array
          description: Every layer, always in this order, always present.
          minItems: 5
          maxItems: 5
          prefixItems:
            - allOf:
                - $ref: '#/components/schemas/LayerResult'
                - properties: { layer: { const: input } }
            - allOf:
                - $ref: '#/components/schemas/LayerResult'
                - properties: { layer: { const: xml } }
            - allOf:
                - $ref: '#/components/schemas/LayerResult'
                - properties: { layer: { const: xsd } }
            - allOf:
                - $ref: '#/components/schemas/LayerResult'
                - properties: { layer: { const: en16931 } }
            - allOf:
                - $ref: '#/components/schemas/LayerResult'
                - properties: { layer: { const: peppol } }
          items:
            $ref: '#/components/schemas/LayerResult'
        counts:
          $ref: '#/components/schemas/FindingCounts'
        findings:
          type: array
          description: Normalised findings in deterministic order. Empty, never null.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Finding'
        findings_summary:
          $ref: '#/components/schemas/FindingsSummary'
        timing:
          $ref: '#/components/schemas/ValidationTiming'
        engine:
          $ref: '#/components/schemas/EngineInfo'
        links:
          $ref: '#/components/schemas/ResultLinks'
        usage:
          $ref: '#/components/schemas/Usage'
      allOf:
        # status and outcome agree: completed <=> a verdict; error <=> indeterminate.
        - if:
            properties: { status: { const: completed } }
          then:
            properties: { outcome: { enum: [valid, invalid] } }
          else:
            properties: { outcome: { const: indeterminate } }
        # valid: nothing failed or errored, and no fatal finding was counted.
        - if:
            properties: { outcome: { const: valid } }
          then:
            properties:
              layers:
                items:
                  properties: { status: { enum: [passed, skipped] } }
              counts:
                properties:
                  by_severity:
                    properties: { fatal: { const: 0 } }
        # invalid: at least one layer failed, none errored, and at least one
        # fatal finding exists - warnings alone never make a document invalid.
        - if:
            properties: { outcome: { const: invalid } }
          then:
            properties:
              layers:
                contains:
                  properties: { status: { const: failed } }
                items:
                  properties: { status: { enum: [passed, failed, skipped] } }
              counts:
                properties:
                  by_severity:
                    properties: { fatal: { minimum: 1 } }
        # indeterminate: at least one layer errored, and nothing was charged.
        - if:
            properties: { outcome: { const: indeterminate } }
          then:
            properties:
              layers:
                contains:
                  properties: { status: { const: error } }
              usage:
                properties: { charged: { const: false } }
        # Authenticated-only fields all hang off the operation record.
        - if:
            anyOf:
              - required: [usage]
              - required: [document_id]
              - required: [links]
          then:
            required: [operation_id]
        # Selection relationships. An exact selector names the release and
        # its state may be any validatable one; latest/detected always
        # resolve the sendable release; the profile source follows the
        # selection method.
        - if:
            properties: { ruleset: { properties: { selection_method: { const: exact } } } }
          then:
            properties:
              ruleset:
                properties:
                  requested: { pattern: '^fwrs_' }
                  state: { enum: [scheduled, sendable, historical] }
              profile:
                properties: { source: { const: requested } }
        - if:
            properties: { ruleset: { properties: { requested: { pattern: '^fwrs_' } } } }
          then:
            properties: { ruleset: { properties: { selection_method: { const: exact } } } }
        - if:
            properties: { ruleset: { properties: { selection_method: { enum: [latest, detected] } } } }
          then:
            properties:
              ruleset:
                properties:
                  requested: { const: latest }
                  state: { const: sendable }
        - if:
            properties: { ruleset: { properties: { selection_method: { const: latest } } } }
          then:
            properties: { profile: { properties: { source: { const: requested } } } }
        - if:
            properties: { ruleset: { properties: { selection_method: { const: detected } } } }
          then:
            properties: { profile: { properties: { source: { const: detected } } } }
        # A hint is only ever produced by a hint pack, which the result names.
        - if:
            properties: { findings: { contains: { required: [hint] } } }
          then:
            properties: { engine: { required: [hint_pack_version] } }

    ValidationVerdict:
      description: >-
        The `200` response of the validate operation: a `ValidationResult`
        that reached a verdict. `status` is `completed`, `outcome` is
        `valid` or `invalid`, and no layer is in `error`. Indeterminate
        results are not representable here; they are Problems.
      allOf:
        - $ref: '#/components/schemas/ValidationResult'
        - properties:
            status: { const: completed }
            outcome: { enum: [valid, invalid] }
            layers:
              items:
                properties: { status: { enum: [passed, failed, skipped] } }

    ValidationInput:
      type: object
      additionalProperties: false
      required: [sha256, bytes, content_type, document_type]
      properties:
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: SHA-256 of the exact bytes received.
        bytes:
          type: integer
          minimum: 0
          maximum: 5242880
        content_type:
          type: string
          enum: [application/xml, text/xml]
        document_type:
          type: string
          description: The document type found at the root element; `unknown` when the root was not recognised or the XML did not parse.
          enum: [invoice, credit_note, unknown]

    RulesetSelection:
      type: object
      description: What was asked for and what was used.
      additionalProperties: false
      required: [requested, id, selection_method, state]
      properties:
        requested:
          $ref: '#/components/schemas/RulesetSelector'
          description: The selector the request carried (defaulted to `latest` if absent). An exact selector equals `id`.
        id:
          $ref: '#/components/schemas/RulesetID'
          description: The immutable ruleset the document was validated against.
        selection_method:
          $ref: '#/components/schemas/SelectionMethod'
        state:
          $ref: '#/components/schemas/RulesetState'
          description: The release's state at validation time. `latest` and `detected` always report `sendable`; `exact` reports whichever validatable state the release is in.
        vesid:
          type: string
          description: The engine's coordinate for the release, for cross-referencing official tooling.
          maxLength: 128
        official_release:
          type: string
          maxLength: 128

    ProfileDetection:
      type: object
      description: The profile family the document was validated as, and how that was decided.
      additionalProperties: false
      required: [family, source]
      properties:
        family:
          $ref: '#/components/schemas/ProfileFamily'
        source:
          type: string
          description: "`requested` (the request named the profile or an exact ruleset) or `detected` (from the document's identifiers)."
          enum: [requested, detected]
        customization_id:
          type: string
          description: The document's `CustomizationID`, a profile identifier - not invoice content. Present when parsed.
          maxLength: 256
        profile_id:
          type: string
          description: The document's `ProfileID`. Present when parsed.
          maxLength: 256

    LayerResult:
      type: object
      additionalProperties: false
      required: [layer, status, fatal, warning]
      properties:
        layer:
          $ref: '#/components/schemas/Layer'
        status:
          $ref: '#/components/schemas/LayerStatus'
        reason:
          $ref: '#/components/schemas/LayerReason'
          description: Required when `status` is `skipped` or `error`; absent otherwise.
        fatal:
          type: integer
          minimum: 0
          description: Fatal findings this layer produced.
        warning:
          type: integer
          minimum: 0
      allOf:
        # A layer that did not run says why, and counted nothing.
        - if:
            properties: { status: { enum: [skipped, error] } }
          then:
            required: [reason]
            properties:
              fatal: { const: 0 }
              warning: { const: 0 }
          else:
            not: { required: [reason] }
        # A layer fails exactly when it produced a fatal finding; warnings
        # alone never fail a layer.
        - if:
            properties: { status: { const: failed } }
          then:
            properties: { fatal: { minimum: 1 } }
        - if:
            properties: { status: { const: passed } }
          then:
            properties: { fatal: { const: 0 } }

    FindingCounts:
      type: object
      additionalProperties: false
      required: [by_severity, by_layer]
      properties:
        by_severity:
          type: object
          additionalProperties: false
          required: [fatal, warning]
          properties:
            fatal: { type: integer, minimum: 0 }
            warning: { type: integer, minimum: 0 }
        by_layer:
          type: object
          additionalProperties: false
          required: [input, xml, xsd, en16931, peppol]
          properties:
            input: { type: integer, minimum: 0 }
            xml: { type: integer, minimum: 0 }
            xsd: { type: integer, minimum: 0 }
            en16931: { type: integer, minimum: 0 }
            peppol: { type: integer, minimum: 0 }

    Finding:
      type: object
      description: >-
        One normalised rule result. The official rule id and severity are
        preserved; message and location are bounded and never carry invoice
        values. Hints are Ironfang's own, versioned by
        `engine.hint_pack_version`, and may be absent.
      additionalProperties: false
      required: [severity, layer, rule_id, message, location_kind, ruleset_id]
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        layer:
          $ref: '#/components/schemas/Layer'
        rule_id:
          type: string
          description: The official rule identifier, e.g. `PEPPOL-EN16931-R020`, `BR-CO-10`, or `cvc-complex-type.2.4.a` for schema errors.
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
        message:
          $ref: '#/components/schemas/FindingMessage'
        location:
          type: string
          description: A bounded, sanitised location. Absent when `location_kind` is `none`.
          minLength: 1
          maxLength: 256
        location_kind:
          $ref: '#/components/schemas/LocationKind'
        hint_code:
          type: string
          pattern: '^[a-z0-9-]{1,80}$'
        hint:
          type: string
          minLength: 1
          maxLength: 512
        source_url:
          $ref: '#/components/schemas/HTTPSURL'
          description: The official specification or rule source for this rule, when known.
        ruleset_id:
          $ref: '#/components/schemas/RulesetID'
      allOf:
        - if:
            properties: { location_kind: { const: none } }
          then:
            not: { required: [location] }
          else:
            required: [location]
        - if:
            required: [hint]
          then:
            required: [hint_code]

    FindingsSummary:
      type: object
      description: >-
        Truncation is explicit. `returned` is the length of `findings`;
        `total` is how many exist; `cap` is the inline maximum; `truncated`
        is `total > returned`, and a truncated result returns exactly `cap`.
      additionalProperties: false
      required: [returned, total, cap, truncated]
      properties:
        returned:
          type: integer
          minimum: 0
          maximum: 1000
        total:
          type: integer
          minimum: 0
        cap:
          type: integer
          const: 1000
        truncated:
          type: boolean
      allOf:
        - if:
            properties: { truncated: { const: true } }
          then:
            properties: { returned: { const: 1000 } }

    ValidationTiming:
      type: object
      additionalProperties: false
      required: [started_at, completed_at, duration_ms]
      properties:
        started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        duration_ms:
          type: integer
          minimum: 0
          maximum: 10000
          description: Wall time, bounded by the 10-second deadline.

    EngineInfo:
      type: object
      description: What ran, exactly, so the result can be reproduced.
      additionalProperties: false
      required: [name, image_digest]
      properties:
        name:
          type: string
          description: The validator engine and version, e.g. `phive/12.1.0`.
          minLength: 1
          maxLength: 64
        image_digest:
          $ref: '#/components/schemas/ImageDigest'
        hint_pack_version:
          type: string
          description: The version of Ironfang's hint mappings applied, when any. Nonblank when present.
          minLength: 1
          maxLength: 32

    ResultLinks:
      type: object
      description: Authorised links, present only on authenticated results whose retention policy keeps them. Time-limited.
      additionalProperties: false
      properties:
        report:
          $ref: '#/components/schemas/HTTPSURL'
        evidence:
          $ref: '#/components/schemas/HTTPSURL'

    Usage:
      type: object
      description: >-
        Present only on authenticated results. Never reported for anonymous
        validation, which has no entitlement to report against.
      additionalProperties: false
      required: [charged, credits]
      properties:
        charged:
          type: boolean
          description: Whether this validation consumed entitlement. Always `false` for indeterminate outcomes.
        credits:
          type: integer
          minimum: 0
          description: Units of the operation's meter this operation used - 1 when charged, otherwise 0.
        remaining:
          type: integer
          minimum: 0
          description: Only on results recorded before usage billing, returned as they were recorded. The month's usage is read at GET /v1/einvoices/usage.
        period_ends_at:
          $ref: '#/components/schemas/Timestamp'
          description: Only on results recorded before usage billing, returned as they were recorded.

    # ---------------------------------------------------------------- problem
    Problem:
      type: object
      description: >-
        An RFC 9457 problem. `code` is the stable, machine-readable Ironfang
        identifier; `type` is its URL and `status` its one HTTP status, both
        fixed per code below. `detail` is safe to show and never carries
        parser output, invoice content or stack traces. Validation findings
        are never Problems.
      additionalProperties: false
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri
          pattern: '^https://ironfang\.com/problems/[a-z_]+$'
        title:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 512
        instance:
          type: string
          format: uri-reference
          maxLength: 256
        code:
          type: string
          description: The stable Ironfang problem code.
          enum:
            - malformed_request
            - unauthenticated
            - insufficient_scope
            - idempotency_conflict
            - payload_too_large
            - unsupported_content_type
            - unknown_ruleset
            - ruleset_disabled
            - result_gone
            - unsupported_profile
            - profile_undetected
            - unsupported_document_type
            - not_found
            - rate_limited
            - quota_exhausted
            - billing_moved
            - free_allowance_exhausted
            - account_budget_exhausted
            - product_budget_exhausted
            - exemption_limit_reached
            - paid_usage_paused
            - payment_required
            - payment_action_required
            - account_restricted
            - account_closed
            - product_not_eligible
            - billing_temporarily_unavailable
            - validation_timeout
            - validator_unavailable
            - jobs_unavailable
            - delivery_unavailable
            - generation_failed
            - report_unavailable
            - report_incomplete
            - render_unavailable
            - render_timeout
            - internal_error
        request_id:
          $ref: '#/components/schemas/RequestID'
        errors:
          type: array
          description: Field-level errors, on `malformed_request` only. Bounded; empty is omitted.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/FieldError'
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
          description: On an indeterminate validation problem only, the operation record that was opened, if any.
        outcome:
          type: string
          const: indeterminate
        usage_charged:
          type: boolean
          const: false
        retry_after_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Only on problems that invite a retry (`rate_limited`, `quota_exhausted`, `validator_unavailable`, `billing_temporarily_unavailable`).
        billing:
          $ref: '#/components/schemas/BillingRefusal'
      allOf:
        # Each code has exactly one status and one type.
        - if: { properties: { code: { const: malformed_request } } }
          then: { properties: { status: { const: 400 }, type: { const: 'https://ironfang.com/problems/malformed_request' } } }
        - if: { properties: { code: { const: unauthenticated } } }
          then: { properties: { status: { const: 401 }, type: { const: 'https://ironfang.com/problems/unauthenticated' } } }
        - if: { properties: { code: { const: insufficient_scope } } }
          then: { properties: { status: { const: 403 }, type: { const: 'https://ironfang.com/problems/insufficient_scope' } } }
        - if: { properties: { code: { const: not_found } } }
          then: { properties: { status: { const: 404 }, type: { const: 'https://ironfang.com/problems/not_found' } } }
        - if: { properties: { code: { const: idempotency_conflict } } }
          then: { properties: { status: { const: 409 }, type: { const: 'https://ironfang.com/problems/idempotency_conflict' } } }
        - if: { properties: { code: { const: result_gone } } }
          then: { properties: { status: { const: 410 }, type: { const: 'https://ironfang.com/problems/result_gone' } } }
        - if: { properties: { code: { const: ruleset_disabled } } }
          then: { properties: { status: { const: 410 }, type: { const: 'https://ironfang.com/problems/ruleset_disabled' } } }
        - if: { properties: { code: { const: payload_too_large } } }
          then: { properties: { status: { const: 413 }, type: { const: 'https://ironfang.com/problems/payload_too_large' } } }
        - if: { properties: { code: { const: unsupported_content_type } } }
          then: { properties: { status: { const: 415 }, type: { const: 'https://ironfang.com/problems/unsupported_content_type' } } }
        - if: { properties: { code: { const: unknown_ruleset } } }
          then: { properties: { status: { const: 422 }, type: { const: 'https://ironfang.com/problems/unknown_ruleset' } } }
        - if: { properties: { code: { const: unsupported_profile } } }
          then: { properties: { status: { const: 422 }, type: { const: 'https://ironfang.com/problems/unsupported_profile' } } }
        - if: { properties: { code: { const: profile_undetected } } }
          then: { properties: { status: { const: 422 }, type: { const: 'https://ironfang.com/problems/profile_undetected' } } }
        - if: { properties: { code: { const: unsupported_document_type } } }
          then: { properties: { status: { const: 422 }, type: { const: 'https://ironfang.com/problems/unsupported_document_type' } } }
        - if: { properties: { code: { const: rate_limited } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/rate_limited' } } }
        - if: { properties: { code: { const: billing_moved } } }
          then: { properties: { status: { const: 410 }, type: { const: 'https://ironfang.com/problems/billing_moved' } } }
        - if: { properties: { code: { const: free_allowance_exhausted } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/free_allowance_exhausted' } } }
        - if: { properties: { code: { const: account_budget_exhausted } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/account_budget_exhausted' } } }
        - if: { properties: { code: { const: product_budget_exhausted } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/product_budget_exhausted' } } }
        - if: { properties: { code: { const: exemption_limit_reached } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/exemption_limit_reached' } } }
        - if: { properties: { code: { const: paid_usage_paused } } }
          then: { properties: { status: { const: 402 }, type: { const: 'https://ironfang.com/problems/paid_usage_paused' } } }
        - if: { properties: { code: { const: payment_required } } }
          then: { properties: { status: { const: 402 }, type: { const: 'https://ironfang.com/problems/payment_required' } } }
        - if: { properties: { code: { const: payment_action_required } } }
          then: { properties: { status: { const: 402 }, type: { const: 'https://ironfang.com/problems/payment_action_required' } } }
        - if: { properties: { code: { const: account_restricted } } }
          then: { properties: { status: { const: 402 }, type: { const: 'https://ironfang.com/problems/account_restricted' } } }
        - if: { properties: { code: { const: account_closed } } }
          then: { properties: { status: { const: 410 }, type: { const: 'https://ironfang.com/problems/account_closed' } } }
        - if: { properties: { code: { const: product_not_eligible } } }
          then: { properties: { status: { const: 403 }, type: { const: 'https://ironfang.com/problems/product_not_eligible' } } }
        - if: { properties: { code: { const: billing_temporarily_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/billing_temporarily_unavailable' } } }
        - if: { properties: { code: { const: quota_exhausted } } }
          then: { properties: { status: { const: 429 }, type: { const: 'https://ironfang.com/problems/quota_exhausted' } } }
        - if: { properties: { code: { const: report_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/report_unavailable' } } }
        - if: { properties: { code: { const: report_incomplete } } }
          then: { properties: { status: { const: 422 }, type: { const: 'https://ironfang.com/problems/report_incomplete' } } }
        - if: { properties: { code: { const: render_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/render_unavailable' } } }
        - if: { properties: { code: { const: render_timeout } } }
          then: { properties: { status: { const: 504 }, type: { const: 'https://ironfang.com/problems/render_timeout' } } }
        - if: { properties: { code: { const: generation_failed } } }
          then: { required: [outcome, usage_charged], properties: { status: { const: 500 }, type: { const: 'https://ironfang.com/problems/generation_failed' } } }
        - if: { properties: { code: { const: internal_error } } }
          then: { properties: { status: { const: 500 }, type: { const: 'https://ironfang.com/problems/internal_error' } } }
        - if: { properties: { code: { const: delivery_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/delivery_unavailable' } } }
        - if: { properties: { code: { const: jobs_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/jobs_unavailable' } } }
        - if: { properties: { code: { const: validator_unavailable } } }
          then: { properties: { status: { const: 503 }, type: { const: 'https://ironfang.com/problems/validator_unavailable' } } }
        - if: { properties: { code: { const: validation_timeout } } }
          then: { properties: { status: { const: 504 }, type: { const: 'https://ironfang.com/problems/validation_timeout' } } }
        # Timeout and unavailability are always indeterminate. internal_error
        # is indeterminate in a validation context (the operation's response
        # schema requires the markers) and carries none on a registry read
        # (that response schema forbids them).
        - if:
            properties: { code: { enum: [validation_timeout, validator_unavailable] } }
          then:
            required: [outcome, usage_charged]
        - if:
            not:
              properties: { code: { enum: [validation_timeout, validator_unavailable, internal_error, generation_failed] } }
          then:
            not:
              anyOf:
                - required: [outcome]
                - required: [usage_charged]
                - required: [operation_id]
        # The markers travel together, and an operation id needs them.
        - if:
            anyOf:
              - required: [outcome]
              - required: [usage_charged]
              - required: [operation_id]
          then:
            required: [outcome, usage_charged]
        # Field errors belong to malformed requests only.
        - if:
            required: [errors]
          then:
            properties: { code: { const: malformed_request } }
        # Only problems that invite a retry say when.
        - if:
            required: [retry_after_seconds]
          then:
            properties: { code: { enum: [rate_limited, quota_exhausted, validator_unavailable, jobs_unavailable, delivery_unavailable, billing_temporarily_unavailable] } }
        # The billing context rides on billing refusals only.
        - if:
            required: [billing]
          then:
            properties: { code: { enum: [free_allowance_exhausted, account_budget_exhausted, product_budget_exhausted, exemption_limit_reached, paid_usage_paused, payment_required, payment_action_required, account_restricted, account_closed, product_not_eligible, billing_temporarily_unavailable] } }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The option or parameter at fault, e.g. `ruleset`, `options.document_type`.
          minLength: 1
          maxLength: 128
        code:
          type: string
          enum: [required, invalid_value, unknown_field, too_long]
        message:
          type: string
          minLength: 1
          maxLength: 256

    # --------------------------------------------------------------- rulesets
    RulesetList:
      type: object
      additionalProperties: false
      required: [schema, rulesets]
      properties:
        schema:
          type: string
          const: financewolf/einvoice/ruleset-list/v1
        rulesets:
          type: array
          description: Empty, never null.
          items:
            $ref: '#/components/schemas/Ruleset'

    RulesetRuntime:
      type: object
      additionalProperties: false
      description: >-
        Metadata observed from the running validator's installed dependencies and
        registered VES. Omitted for retained engines without runtime reporting or
        before a successful health observation. observed_at is not a readiness
        guarantee. Library versions are not Peppol or EN 16931 specification versions.
        Upstream deprecation/effective dates describe the VES; state/latest describe
        Ironfang Finance's independently managed release lifecycle.
      required: [validator_version, phive_version, phive_rules_version, phive_rules_peppol_version, saxon_version, name, upstream_deprecated, observed_at]
      properties:
        validator_version:
          type: string
          maxLength: 32
          pattern: '^[0-9][0-9A-Za-z.+-]{0,31}$'
        phive_version:
          type: string
          maxLength: 32
          pattern: '^[0-9][0-9A-Za-z.+-]{0,31}$'
        phive_rules_version:
          type: string
          maxLength: 32
          pattern: '^[0-9][0-9A-Za-z.+-]{0,31}$'
        phive_rules_peppol_version:
          type: string
          maxLength: 32
          pattern: '^[0-9][0-9A-Za-z.+-]{0,31}$'
        saxon_version:
          type: string
          maxLength: 32
          pattern: '^[0-9][0-9A-Za-z.+-]{0,31}$'
        name:
          type: string
          minLength: 1
          maxLength: 256
        upstream_deprecated:
          type: boolean
        upstream_valid_from:
          type: string
          format: date-time
        upstream_valid_until:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time

    Ruleset:
      type: object
      description: >-
        The customer-safe identity of one immutable ruleset: everything
        needed to select it and to reproduce a validation that named it.
        Internal storage, review records and operator identities are not
        part of this contract.
      additionalProperties: false
      required:
        - schema
        - id
        - state
        - latest
        - profile_family
        - document_type
        - syntax
        - official_release
        - en16931_release
        - bis_release
        - vesid
        - engine
        - valid_from
        - valid_until
        - sources
        - artifacts
      properties:
        runtime:
          $ref: '#/components/schemas/RulesetRuntime'
        schema:
          type: string
          const: financewolf/einvoice/ruleset/v1
        id:
          $ref: '#/components/schemas/RulesetID'
        state:
          $ref: '#/components/schemas/RulesetState'
        latest:
          type: boolean
          description: "True on the one `sendable` release `ruleset: latest` currently resolves to for this profile family and document type."
        profile_family:
          $ref: '#/components/schemas/ProfileFamily'
        document_type:
          $ref: '#/components/schemas/DocumentType'
        syntax:
          type: string
          enum: [UBL 2.1]
        official_release:
          type: string
          description: The standards body's release name.
          minLength: 1
          maxLength: 128
        en16931_release:
          type: string
          minLength: 1
          maxLength: 32
        bis_release:
          type: string
          minLength: 1
          maxLength: 32
        vesid:
          type: string
          minLength: 1
          maxLength: 128
        engine:
          $ref: '#/components/schemas/EngineInfo'
        valid_from:
          $ref: '#/components/schemas/Timestamp'
          description: When the official release takes effect. Part of the release's identity; never changes.
        valid_until:
          description: The official end of validity, or null when open-ended. Never changes.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        published_on:
          description: The standards body's publication date, when known.
          oneOf:
            - type: string
              format: date
            - type: 'null'
        retired_at:
          description: When Ironfang stopped sending against this release. Distinct from the official window.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        replaced_by:
          description: The release that superseded this one, when retired.
          oneOf:
            - $ref: '#/components/schemas/RulesetID'
            - type: 'null'
        sources:
          type: array
          description: Official sources for the release. Never empty.
          minItems: 1
          items:
            $ref: '#/components/schemas/HTTPSURL'
        artifacts:
          type: array
          description: Exactly one checksummed rule artefact per layer - xsd, en16931 and peppol.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/RulesetArtifact'
          allOf:
            - contains: { properties: { layer: { const: xsd } } }
            - contains: { properties: { layer: { const: en16931 } } }
            - contains: { properties: { layer: { const: peppol } } }
      allOf:
        - if:
            properties: { latest: { const: true } }
          then:
            properties: { state: { const: sendable } }
        - if:
            properties: { state: { const: historical } }
          then:
            required: [retired_at]
            properties:
              retired_at: { $ref: '#/components/schemas/Timestamp' }

    RulesetArtifact:
      type: object
      description: One rule artefact's checksum and provenance. Where the files live is not part of the contract.
      additionalProperties: false
      required: [layer, sha256, licence, licence_status, source_url]
      properties:
        layer:
          type: string
          enum: [xsd, en16931, peppol]
        sha256:
          $ref: '#/components/schemas/SHA256'
        licence:
          type: string
          description: The artefact's own licence, as an SPDX identifier or `NOASSERTION`.
          minLength: 1
          maxLength: 64
        licence_status:
          $ref: '#/components/schemas/LicenceStatus'
        source_url:
          $ref: '#/components/schemas/HTTPSURL'
