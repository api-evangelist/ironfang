  /v1/einvoices/reports:
    post:
      operationId: createEinvoiceReport
      summary: Download a signed report for a retained result
      tags: [reports]
      description: |
        Requires finance:einvoices:read and a tenant-owned, retained completed
        validation or generation result with all findings present. Truncated
        findings return 422 report_incomplete. Signing is separately configured;
        unavailable signing or rendering returns 503 report_unavailable.
        Send operation_id and optional include_pdf in a JSON body of at most 1024
        bytes. Query parameters, compression and Idempotency-Key are rejected.
        The ZIP includes a canonical manifest, domain-separated Ed25519 signature,
        exact saved result, complete findings and a readable HTML report. Generated
        XML is included when retained; include_pdf also binds a fresh readable PDF
        and its template version. Validation-only results cannot include a PDF.
        Optional RFC 3161 timestamps are signed as required when configured.
        There is no new validation, usage charge or hosted report retention.
        Issuance time/signatures may change on repeated downloads; original facts
        stay pinned. Expiry/deletion is checked again before releasing the bundle.
        Issuance has a 45-second deadline, two slots per API process and a 48 MiB
        compressed/expanded bundle limit. A signature does not certify compliance.
      security:
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:read]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportRequest'}
      responses:
        '200':
          description: Signed Ironfang Finance report ZIP attachment; Cache-Control no-store.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/ResultGone'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '422':
          description: Retained findings are truncated; no complete signed report can be issued.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: {enum: [report_incomplete]}
                      status: {const: 422}
        '503':
          description: Report dependency unavailable; the saved result and usage are unchanged.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: {enum: [report_unavailable]}
                      status: {const: 503}
  /v1/einvoices/reports/verify:
    post:
      operationId: verifyEinvoiceReport
      summary: Verify report integrity without an account
      tags: [reports]
      security: []
      description: |
        Send the ZIP as application/zip. No API key or subscription is needed.
        Ironfang Finance verifies the canonical manifest, domain-separated signature
        against operator-controlled public keys, every bundled artifact hash and
        the optional timestamp against configured TSA trust roots. It performs
        no network access, no PHIVE validation and no upload retention. For a
        completely local check use `ironfang finance verify` with independent trust keys.
        HTTP 200 contains verified true or false. Verified means report integrity,
        not a valid invoice; inspect invoice_outcome separately. Unknown or revoked
        keys, tampering, missing timestamp trust and unsupported schemas fail.
        Requests are bounded to 48 MiB compressed and expanded, nine allowed ZIP
        members, two concurrent checks per API process and a 15-second deadline.
        No query, compression or Idempotency-Key is accepted. Per-address anonymous
        limits apply. Failure details contain no invoice content.
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Integrity verification result; Cache-Control no-store.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportVerification'}
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
  /v1/einvoices/reports/keys:
    get:
      operationId: getEinvoiceReportKeys
      summary: Read Ironfang Finance report signing public keys
      tags: [reports]
      security: []
      description: |
        Operator-configured Ed25519 public keys only. Active keys sign new reports;
        retired keys verify old reports; revoked keys are refused. An empty list
        means no trust keys are configured. Cache lifetime is 300 seconds. Offline
        verifiers must obtain this document through an independently trusted channel
        and maintain revocation updates. Never trust a key supplied by a report.
      responses:
        '200':
          description: Public report trust metadata.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportKeySet'}
  /v1/einvoices/render:
    post:
      operationId: renderEinvoice
      summary: Render a saved generation as a readable PDF
      description: |
        Requires finance:einvoices:read and a tenant-owned, unexpired successful
        generation operation. Supply only operation_id in a JSON body of at most
        1024 bytes. Validation-only and anonymous results cannot be rendered.
        Unknown or foreign IDs return 404; expired/deleted results return 410.
        Query parameters, Idempotency-Key, customer HTML, URLs and render options
        are not accepted. The source XML and PHIVE verdict are checked before
        rendering; no new validation, operation, usage charge or PDF retention occurs.
        The versioned template preserves XML values, labels the PDF as a readable
        representation, and includes the source SHA-256 and original ruleset.
        A PDF is not a new validation verdict or a compliance certificate.
        At most two render requests prepare source data per API process; excess
        requests return 429 with Retry-After. Rendering has a 30-second deadline
        and a 32 MiB output limit; failure
        leaves the retained result and its original charge unchanged. PDF bytes
        may vary across Chromium builds and request times. Responses are no-store.
      tags: [rendering]
      security:
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Readable representation of the exact retained generated XML, as an attachment.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
            X-Ironfang-Source-SHA256:
              description: SHA-256 of the authoritative XML.
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            X-Ironfang-Template-Version:
              description: Ironfang Finance readable template version.
              schema: {type: string}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/ResultGone'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '503':
          description: Readable PDF engine unavailable. The original validation result and usage are unchanged.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: {enum: [render_unavailable]}
                      status: {const: 503}
                    not:
                      anyOf:
                        - required: [outcome]
                        - required: [usage_charged]
                        - required: [operation_id]
        '504':
          description: Readable PDF processing deadline exceeded. The original validation result and usage are unchanged.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: {enum: [render_timeout]}
                      status: {const: 504}
                    not:
                      anyOf:
                        - required: [outcome]
                        - required: [usage_charged]
                        - required: [operation_id]
  /v1/einvoices/generate:
    post:
      tags:
      - generation
      operationId: generateEInvoice
      summary: Generate and validate one UBL e-invoice
      description: 'Accepts generation-input/v1 JSON with decimal strings. Both ruleset (latest or an exact
        immutable ID) and profile are required; document_type comes from the body. Unknown or repeated query
        parameters, duplicate JSON keys, unknown fields, nulls, JSON numbers and inconsistent calculated
        totals are refused before acceptance. UTF-8 application/json only; uncompressed body at most 5 MiB.


        The operation pins the selected ruleset, generator/schema versions and engine image at acceptance.
        Only the exact generated XML bytes validated by that engine can succeed. Every validation layer
        must pass. Generated XML which fails the rules is an internal 500 generation_failed, indeterminate
        and uncharged; no artifact or customer-invalid verdict is returned. Dependency failures are 503/504.
        Validation has a 10-second deadline and result persistence a separate 5-second budget.


        Authenticated requests require finance:einvoices:write and optionally Idempotency-Key. The key
        is scoped to the organisation and generation endpoint. Input identity is financewolf-json/1: UTF-8
        JSON decoded and re-encoded with sorted object keys, compact separators and Go JSON string escaping.
        Whitespace, object key order and equivalent string escapes do not change identity; decimal string
        spelling and array order do. An existing key replays the original bytes without execution or a second
        usage event even after latest or the deployed generator changes; different content or selectors
        produce 409. Anonymous requests cannot supply Idempotency-Key or a tenant header and create no stored
        operation or usage event.


        The successful response contains base64 of the exact XML, its SHA-256 and a nested validation verdict.
        One authenticated success records one einvoice.generation usage event. Source JSON is never retained.
        Authenticated generated XML and validation findings are retained together for 30 days, retrievable/deletable
        through /v1/einvoices/results/{id}; anonymous results are not retained. Deletion/expiry erases artifacts
        and findings but preserves the operation and usage identity, so a replay returns 410 and never runs
        or charges again. Responses use Cache-Control: no-store and the standard request correlation headers.'
      security:
      - {}
      - platformKey: []
      x-ironfang-scopes: [finance:einvoices:write]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: ruleset
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/RulesetSelector'
      - name: profile
        in: query
        required: true
        schema:
          type: string
          enum:
          - peppol-bis-billing-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequest'
      responses:
        '200':
          description: Only a fully validated artifact, after atomic authenticated persistence.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResult'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/ScopeOrEligibility'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '410':
          $ref: '#/components/responses/ValidationGone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          description: Generation selection refused.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - properties:
                    code:
                      enum:
                      - unknown_ruleset
                      - unsupported_profile
                      - unsupported_document_type
                    status:
                      const: 422
        '429':
          $ref: '#/components/responses/ValidationRateLimited'
        '500':
          description: Indeterminate generation failure; no artifact is returned and nothing is charged.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - required:
                  - outcome
                  - usage_charged
                  properties:
                    code:
                      enum:
                      - internal_error
                      - generation_failed
                    status:
                      const: 500
        '503':
          $ref: '#/components/responses/ValidatorUnavailable'
        '504':
          $ref: '#/components/responses/ValidationTimeout'
  /v1/einvoices/validate:
    post:
      tags: [validation]
      operationId: validateEInvoice
      summary: Validate one e-invoice XML document
      description: |
        Validates a single UBL Invoice or CreditNote document synchronously and
        returns a `ValidationVerdict`.

        **Body.** Send the raw XML as the request body with
        `Content-Type: application/xml` or `text/xml`, choosing the ruleset
        with the query parameters. Or send `multipart/form-data` with a
        `document` part holding the XML and an optional `options` part
        holding a JSON `ValidationOptions` object; query parameters are not
        read for multipart requests. The multipart form is the one to use
        from browsers and low-code tools.

        **Strictness.** For raw XML bodies, a query parameter that is
        repeated or not one of `ruleset`, `profile` and `document_type` is
        `400 malformed_request`, so a misspelt selector cannot silently fall
        back to a default. For multipart bodies, exactly one `document`
        part (an XML media type) and at most one `options` part
        (`application/json`) are accepted; a repeated or unknown part is
        `400 malformed_request`. A `Content-Encoding` other than identity is
        `415 unsupported_content_type`.

        **Correlation.** Every response carries `X-Ironfang-Request-ID`,
        Ironfang's id for the request, which every Problem repeats as
        `request_id`. Send your own `X-Request-ID` and it is echoed back
        unchanged.

        **Limits.** The XML is at most 5 MiB (5,242,880 bytes), 64 levels
        deep and 250,000 elements. Archives and compressed bodies
        (`Content-Encoding` other than identity, ZIP, gzip) are refused with
        `415 unsupported_content_type`; a larger body with
        `413 payload_too_large`. The validation deadline is 10 seconds; a
        validation that exceeds it is indeterminate (`504`).

        **Ruleset selection.** `ruleset` is either the keyword `latest` or an
        exact immutable ruleset id (`fwrs_...`).

        - `latest` resolves to the currently `sendable` release for the
          document's profile family at the moment of the request. With a
          `profile`, the result reports `selection_method: latest`; without
          one, the family is detected from the document's `CustomizationID`
          and `ProfileID` and the result reports `selection_method:
          detected`. Detection is for validation only; it is never a
          statement about what the document should be. A document whose
          profile cannot be detected - including XML that does not parse -
          is `422 profile_undetected`; name a `profile` or an exact ruleset
          to obtain a verdict on it.
        - An exact id validates against that release whatever its state
          among `scheduled` (migration testing), `sendable` (current) and
          `historical` (audit and reproduction). The result reports
          `selection_method: exact` and the release's `state`. An id that is
          unknown - or names an internal candidate, which is
          indistinguishable from unknown - is `422 unknown_ruleset`; a
          withdrawn release is `410 ruleset_disabled`.

        The result always names the resolved immutable id in `ruleset.id`.

        **Outcome versus status.** The result separates how far execution
        got (`status`) from what the standard concluded (`outcome`). A
        document that fails the standard at any layer - including malformed
        XML at the `xml` layer - is a successfully processed validation:
        HTTP `200` with `outcome: invalid`, and every deeper layer that could
        not run is reported as `skipped`, never omitted. Only the request
        itself being wrong, or Ironfang Finance being unable to decide, produces a
        Problem.

        **Idempotency.** Authenticated requests may send an
        `Idempotency-Key` (8-128 characters of `A-Z a-z 0-9 _ -`). The key
        is scoped to the organisation and the validation endpoint. Replaying
        the same request with the same key returns the original operation
        and its result - the same `operation_id`, no second execution, no
        second charge - even if `latest` has since come to mean a newer
        release. A request is identified by its content: reusing a key with
        different document bytes (a different input SHA-256) or a different
        ruleset, profile or document type is `409 idempotency_conflict`.
        Requests without a key always create a new operation. Anonymous
        requests do not use the header.

        **Findings.** At most 1,000 findings are returned inline, in
        deterministic order: layer order, then severity (`fatal` before
        `warning`), then `rule_id`, then `location`, then `message`.
        `findings_summary` always states how many were returned, how many
        exist, the cap, and whether truncation happened.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: ruleset
          in: query
          description: "`latest` (default) or an exact ruleset id. Read for raw XML bodies only."
          required: false
          schema:
            $ref: '#/components/schemas/RulesetSelector'
        - name: profile
          in: query
          description: "Profile family to resolve `latest` within. Omit to detect it from the document. Read for raw XML bodies only."
          required: false
          schema:
            $ref: '#/components/schemas/ProfileFamily'
        - name: document_type
          in: query
          description: "Expected document type, or `auto` (default) to detect it from the root element. A mismatch is `422 unsupported_document_type`. Read for raw XML bodies only."
          required: false
          schema:
            $ref: '#/components/schemas/DocumentTypeSelector'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/XMLDocument'
          text/xml:
            schema:
              $ref: '#/components/schemas/XMLDocument'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties:
                document:
                  $ref: '#/components/schemas/XMLDocument'
                options:
                  $ref: '#/components/schemas/ValidationOptions'
            encoding:
              document:
                contentType: application/xml, text/xml
              options:
                contentType: application/json
      responses:
        '200':
          description: >-
            A verdict. `status` is `completed`, `outcome` is `valid` or
            `invalid`, and no layer is in `error`. A standards failure at any
            layer is this response, not a Problem.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationVerdict'
              examples:
                valid:
                  summary: A conformant invoice, authenticated, latest within a named profile
                  externalValue: https://api.ironfang.com/finance/examples/v1-validation-result-valid.json
                invalid-findings:
                  summary: An invoice that fails Peppol rules, anonymous, profile detected
                  externalValue: https://api.ironfang.com/finance/examples/v1-validation-result-invalid.json
                malformed-xml:
                  summary: Malformed XML against an exact ruleset - deeper layers skipped
                  externalValue: https://api.ironfang.com/finance/examples/v1-validation-result-malformed-xml.json
                exact-historical:
                  summary: Reproduction against an exact historical release
                  externalValue: https://api.ironfang.com/finance/examples/v1-validation-result-exact-historical.json
                exact-scheduled:
                  summary: Migration testing against an exact scheduled release
                  externalValue: https://api.ironfang.com/finance/examples/v1-validation-result-exact-scheduled.json
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/ScopeOrEligibility'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '410':
          $ref: '#/components/responses/ValidationGone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '422':
          $ref: '#/components/responses/UnsupportedSelection'
        '429':
          $ref: '#/components/responses/ValidationRateLimited'
        '500':
          $ref: '#/components/responses/ValidationInternalError'
        '503':
          $ref: '#/components/responses/ValidatorUnavailable'
        '504':
          $ref: '#/components/responses/ValidationTimeout'

  /v1/einvoices/rulesets:
    get:
      tags: [rulesets]
      operationId: listEInvoiceRulesets
      summary: List rulesets available for selection and reproduction
      description: |
        Lists the immutable rulesets a caller may validate against:
        `scheduled`, `sendable` and `historical` releases. Candidate releases
        are internal and never listed; `disabled` releases are withdrawn and
        never appear in a successful body - their ids answer `410` on the
        exact read.

        Exactly one `sendable` release per profile family and document type
        carries `latest: true`: that is what `ruleset: latest` resolves to for
        a request made now. `scheduled` releases show what `latest` will
        become and when, and may be validated against by exact id for
        migration testing; `historical` releases stay retrievable and
        validatable by exact id so an older result can be reproduced.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:rulesets:read]
      parameters:
        - name: document_type
          in: query
          required: false
          description: "Restrict to one document type. Omit for both. A repeated or unknown query parameter is `400 malformed_request`."
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: profile
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProfileFamily'
        - name: state
          in: query
          required: false
          description: Restrict to one lifecycle state.
          schema:
            $ref: '#/components/schemas/RulesetState'
      responses:
        '200':
          description: The matching rulesets, newest effective date first.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetList'
              examples:
                list:
                  summary: Upcoming, current and past releases for invoices
                  externalValue: https://api.ironfang.com/finance/examples/v1-ruleset-list.json
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'

  /v1/einvoices/rulesets/{id}:
    get:
      tags: [rulesets]
      operationId: getEInvoiceRuleset
      summary: Fetch one ruleset by its immutable id
      description: |
        Returns the customer-safe identity of one ruleset: enough to select
        it, to know its state, and to reproduce a validation that named it.
        `scheduled`, `sendable` and `historical` releases are returned in
        full. A `disabled` release answers `410 ruleset_disabled`: its id is
        acknowledged, its content is withdrawn, and it never appears in a
        successful body. `latest` is a selection keyword, not an id:
        `GET .../rulesets/latest` is `404`. Candidate releases are internal
        and indistinguishable from unknown: `404`.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:rulesets:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RulesetID'
      responses:
        '200':
          description: The ruleset.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
              examples:
                historical:
                  summary: An exact historical release, still reproducible
                  externalValue: https://api.ironfang.com/finance/examples/v1-ruleset-historical.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/RulesetDisabled'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'

  /v1/einvoices/results:
    get:
      operationId: listValidationResults
      summary: List saved validation and generation results
      description: >-
        Returns a bounded page of result metadata, newest first by creation time and operation ID.
        Include cursor (empty on the first page) for stable timestamp/ID cursors; pass next_cursor
        as cursor for subsequent pages. Without cursor, next_cursor is a legacy operation ID to
        pass as before. Total counts all matching metadata, including expired/deleted records,
        independently of the page boundary. Names are hidden and cannot match search after expiry
        or deletion. Requires finance:einvoices:read.
      tags:
      - results
      security:
      - platformKey: []
      parameters:
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/OpaqueID'
        description: Legacy last operation ID; cannot be combined with cursor. Unknown or foreign IDs return 404.
      - name: cursor
        in: query
        allowEmptyValue: true
        schema:
          type: string
          maxLength: 256
        description: Include empty on the first page to opt into stable cursors, then pass next_cursor here.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: kind
        in: query
        schema:
          type: string
          enum: [validate, generate]
      - name: outcome
        in: query
        schema:
          type: string
          enum: [valid, invalid]
      - name: ruleset
        in: query
        schema:
          $ref: '#/components/schemas/RulesetID'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 255
        description: Case-insensitive literal substring of operation ID or an available document name. NUL is rejected.
      - name: operation_id
        in: query
        schema:
          type: string
          format: uuid
        description: Exact tenant-owned operation ID for bounded metadata lookup. Unknown or foreign IDs return an empty list.
      responses:
        '200':
          description: Tenant-owned saved results. Cache-Control is no-store.
          headers: &id001
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedResultList'
              examples:
                empty:
                  externalValue: https://api.ironfang.com/finance/examples/v1-retained-results-empty.json
        '400': &id002
          $ref: '#/components/responses/MalformedRequest'
        '401': &id003
          $ref: '#/components/responses/Unauthenticated'
        '403': &id004
          $ref: '#/components/responses/InsufficientScope'
        '404': &id005
          $ref: '#/components/responses/NotFound'
        '429': &id006
          $ref: '#/components/responses/ReadRateLimited'
        '500': &id007
          $ref: '#/components/responses/ReadInternalError'
  /v1/einvoices/results/{id}:
    get:
      operationId: getValidationResult
      summary: Read a saved validation or generation result
      description: Returns the exact original JSON while retained. Unknown or foreign IDs answer 404; expired/deleted
        results answer 410. Requires finance:einvoices:read.
      tags:
      - results
      security:
      - platformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueID'
      responses:
        '200':
          description: Tenant-owned saved results. Cache-Control is no-store.
          headers: *id001
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationVerdict'
                  - $ref: '#/components/schemas/GenerationResult'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '429': *id006
        '500': *id007
        '410':
          $ref: '#/components/responses/ResultGone'
    delete:
      operationId: deleteValidationResult
      summary: Delete saved result bytes and findings
      description: Requires finance:einvoices:write. Erases response and findings atomically. Repeated
        deletion returns 204. Operation/usage metadata and idempotency hashes remain; replay will never
        repeat the validation. Unknown or foreign IDs answer 404.
      tags:
      - results
      security:
      - platformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueID'
      responses:
        '204':
          description: Result bytes and findings are deleted; operation and usage metadata remain.
          headers: *id001
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '429': *id006
        '500': *id007

components:
  securitySchemes:
    platformKey:
      type: http
      scheme: bearer
      description: >-
        An Ironfang platform API key minted in the portal. Scopes listed on
        an operation are the ones the key must carry. Keys are the only
        credential this boundary accepts in V1.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional on authenticated requests. The same key with the same
        request replays the original operation; the same key with a
        different request (different document bytes, ruleset, profile or
        document type) is `409 idempotency_conflict`. Scoped to the
        organisation and the validation endpoint. Anonymous requests never
        use it.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'

  headers:
    XIronfangRequestID:
      description: >-
        Ironfang's internal request id, minted at the edge for every request
        and carried in every Problem body as `request_id`. Quote it in support
        requests.
      schema:
        $ref: '#/components/schemas/RequestID'
    XRequestIDEcho:
      description: >-
        Your own correlation id, echoed back when the request carried a
        well-formed `X-Request-ID`: visible ASCII only (bytes 0x21 to 0x7E, so
        no spaces or control characters), 1 to 128 bytes. Anything else is
        ignored, not echoed. Never used as Ironfang's identifier for the
        request.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]{1,128}$'
    RetryAfter:
      description: Seconds to wait before retrying. Mirrors `retry_after_seconds` in the body.
      schema:
        type: integer
        minimum: 1

  # Every error response pins the exact Problem codes and HTTP status it can
  # carry: a 401 body cannot validate as a timeout merely because both are
  # Problems. The base Problem schema fixes each code's status and type.
  responses:
    PaymentRequired:
      description: >-
        The free allowance is used up and paid usage cannot continue until
        the billing account is put right: paused, no working payment method,
        a payment awaiting confirmation, or restricted. No work or usage was
        accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code: { enum: [paid_usage_paused, payment_required, payment_action_required, account_restricted] }
                status: { const: 402 }
    ScopeOrEligibility:
      description: >-
        The key lacks the scope this operation needs, or paid Ironfang
        Finance usage needs an approved business and the free allowance is
        used up. No work or usage was accepted.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code: { enum: [insufficient_scope, product_not_eligible] }
                status: { const: 403 }
    AdmissionGone:
      description: The release was withdrawn from every use, or the billing account is closed. Nothing was queued.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code: { enum: [ruleset_disabled, account_closed] }
                status: { const: 410 }
    DeliveryRateLimited:
      description: Delivery management failed; the invoice outcome is unchanged.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - rate_limited
                  - quota_exhausted
                status:
                  const: 429
              not:
                anyOf:
                - required:
                  - outcome
                - required:
                  - usage_charged
                - required:
                  - operation_id
    DeliveryUnavailable:
      description: Delivery management failed; the invoice outcome is unchanged.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - delivery_unavailable
                status:
                  const: 503
              not:
                anyOf:
                - required:
                  - outcome
                - required:
                  - usage_charged
                - required:
                  - operation_id
    ValidationGone:
      description: The selected release is withdrawn, the original saved result expired or was deleted, or
        the billing account is closed. Result replay never executes again.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - ruleset_disabled
                  - result_gone
                  - account_closed
                status:
                  const: 410
    ResultGone:
      description: This validation result expired or was deleted. Operation and usage metadata remain.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  enum:
                  - result_gone
                status:
                  const: 410
    MalformedRequest:
      description: The request itself is wrong - not the document being validated.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [malformed_request] }
                  status: { const: 400 }
          examples:
            field-errors:
              summary: Bad option values
              externalValue: https://api.ironfang.com/finance/examples/v1-problem-field-errors.json
    Unauthenticated:
      description: A credential was presented and could not be verified. Anonymous access, where permitted, sends no credential at all.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [unauthenticated] }
                  status: { const: 401 }
    InsufficientScope:
      description: The key is valid but does not carry the scope this operation needs.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [insufficient_scope] }
                  status: { const: 403 }
    IdempotencyConflict:
      description: >-
        The `Idempotency-Key` was already used by this organisation, on the
        validation endpoint, for a request with different content. The
        original operation is left untouched; send a new key for a new
        request.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [idempotency_conflict] }
                  status: { const: 409 }
    PayloadTooLarge:
      description: The body exceeds 5 MiB.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [payload_too_large] }
                  status: { const: 413 }
    UnsupportedContentType:
      description: The body is not XML (an archive, a compressed body, or another media type).
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [unsupported_content_type] }
                  status: { const: 415 }
    UnsupportedSelection:
      description: >-
        The requested ruleset, profile or document type cannot be used:
        `unknown_ruleset` (unknown, or an internal candidate),
        `unsupported_profile`, `profile_undetected` or
        `unsupported_document_type`. The document was not validated.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [unknown_ruleset, unsupported_profile, profile_undetected, unsupported_document_type] }
                  status: { const: 422 }
    ValidationRateLimited:
      description: >-
        Per-address or per-key rate limit (`rate_limited`), which asks for a
        retry, or the billing account can admit no more of this work this
        month: the free allowance used up without paid usage, or a monthly
        limit reached.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [rate_limited, free_allowance_exhausted, account_budget_exhausted, product_budget_exhausted, exemption_limit_reached] }
                  status: { const: 429 }
    ReadRateLimited:
      description: Per-address or per-key rate limit. Ruleset reads are not metered, so no quota problem is possible here.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [rate_limited] }
                  status: { const: 429 }
    NotFound:
      description: No such ruleset visible to this caller (unknown, an internal candidate, or the keyword `latest`).
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [not_found] }
                  status: { const: 404 }
    RulesetDisabled:
      description: The ruleset id is known but the release has been withdrawn from every use, validation included.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [ruleset_disabled] }
                  status: { const: 410 }
    ValidationInternalError:
      description: >-
        Ironfang Finance failed while validating, in a way that is not the
        validator's own. Indeterminate: the body says `outcome:
        indeterminate` and `usage_charged: false`.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - required: [outcome, usage_charged]
                properties:
                  code: { enum: [internal_error] }
                  status: { const: 500 }
          examples:
            internal:
              summary: An internal failure during validation
              externalValue: https://api.ironfang.com/finance/examples/v1-problem-validation-internal.json
    ReadInternalError:
      description: >-
        Ironfang Finance failed while reading the registry. Not a validation
        verdict: the body carries no outcome or usage fields.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [internal_error] }
                  status: { const: 500 }
                not:
                  anyOf:
                    - required: [outcome]
                    - required: [usage_charged]
                    - required: [operation_id]
    ValidatorUnavailable:
      description: >-
        The validator crashed, was unavailable, or an internal dependency
        failed. Indeterminate: `outcome: indeterminate`, `usage_charged:
        false`. Or billing was briefly unavailable
        (`billing_temporarily_unavailable`), and nothing was accepted. Retry
        after the indicated delay.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [validator_unavailable, billing_temporarily_unavailable] }
                  status: { const: 503 }
          examples:
            unavailable:
              summary: Validator dependency failure
              externalValue: https://api.ironfang.com/finance/examples/v1-problem-indeterminate-unavailable.json
    ValidationTimeout:
      description: >-
        The 10-second validation deadline passed. Indeterminate: `outcome:
        indeterminate`, `usage_charged: false`.
      headers:
        X-Ironfang-Request-ID:
          $ref: '#/components/headers/XIronfangRequestID'
        X-Request-ID:
          $ref: '#/components/headers/XRequestIDEcho'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  code: { enum: [validation_timeout] }
                  status: { const: 504 }
          examples:
            timeout:
              summary: Deadline exceeded
              externalValue: https://api.ironfang.com/finance/examples/v1-problem-indeterminate-timeout.json

  schemas:
    BatchList:
      type: object
      additionalProperties: false
      required:
      - batches
      - next_cursor
      properties:
        batches:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchSummary'
        next_cursor:
          type: string
    BatchSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - counts
      - job_count
      properties:
        id:
          $ref: '#/components/schemas/OpaqueID'
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          - partial
        created_at:
          type: string
          format: date-time
        counts:
          type: object
          additionalProperties: false
          required:
          - queued
          - running
          - completed
          - failed
          - cancelled
          properties:
            queued:
              type: integer
              minimum: 0
              maximum: 100
            running:
              type: integer
              minimum: 0
              maximum: 100
            completed:
              type: integer
              minimum: 0
              maximum: 100
            failed:
              type: integer
              minimum: 0
              maximum: 100
            cancelled:
              type: integer
              minimum: 0
              maximum: 100
        job_count:
          type: integer
          minimum: 0
          maximum: 100
    JobList:
      type: object
      additionalProperties: false
      required:
      - jobs
      - next_cursor
      properties:
        jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/JobResponse'
        next_cursor:
          type: string
    UsageReport:
      type: object
      additionalProperties: false
      required: [product, metered, period_start, period_end, catalogue_version, mode, paid_eligible, currency, meters, billing, operations]
      properties:
        product: { const: finance }
        metered:
          type: boolean
          description: False where unified billing is off; nothing is charged and `meters` is empty.
        period_start: &usage001
          type: string
          format: date-time
        period_end: *usage001
        catalogue_version:
          type: string
          description: The billing catalogue that prices the month; empty when unmetered.
        mode:
          type: string
          description: The billing account's mode; empty when unmetered.
          enum: ['', free, setup_pending, enabled, paused, closed]
        paid_eligible:
          type: boolean
          description: Whether the organisation's business is approved for paid Finance usage.
        currency: { const: GBP }
        meters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [meter, operation, unit, free_allowance, used, free_used, billable, reserved, remaining_free, charge, exempt]
            properties:
              meter: { type: string, enum: [finance.validation, finance.generation] }
              operation: { type: string, enum: [validate, generate] }
              unit: { type: string }
              free_allowance: &usage002
                type: integer
                minimum: 0
              used: *usage002
              free_used: *usage002
              billable: *usage002
              reserved: *usage002
              remaining_free: *usage002
              charge:
                type: string
                description: The month's charge so far in pounds, before tax.
                pattern: '^[0-9]+[.][0-9]{2,8}$'
              exempt: { type: boolean }
        billing:
          type: string
          const: /billing/v1
          description: Where the account's usage, limits, payment and invoices are managed.
        operations:
          type: object
          additionalProperties: false
          required: [period_start, period_end, charged_operations, usage_events, in_progress_operations, mismatches, groups]
          properties:
            period_start: *usage001
            period_end: *usage001
            charged_operations: *usage002
            usage_events: *usage002
            in_progress_operations: *usage002
            mismatches: *usage002
            groups:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [admission, source, event_type, quantity]
                properties:
                  admission:
                    type: string
                    description: '`usage` for operations the billing account admitted; the retired plan key for older ones.'
                  source: { type: string }
                  event_type:
                    enum:
                    - einvoice.validation
                    - einvoice.generation
                  quantity: *usage002
    BillingRefusal:
      type: object
      description: >-
        On a billing refusal only: the product and meter the billing account
        refused, and when the free allowance renews (the start of the next
        UTC month) where that is the reason.
      additionalProperties: false
      properties:
        product: { type: string, enum: [finance] }
        meter: { type: string, enum: [finance.validation, finance.generation] }
        reset_at: { type: string, format: date-time }
    DestinationConfig:
      type: object
      additionalProperties: false
      required: []
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        endpoint:
          type: string
          format: uri
          maxLength: 2048
        region:
          type: string
          maxLength: 63
        bucket:
          type: string
          maxLength: 63
        prefix:
          type: string
          maxLength: 200
        path_style:
          type: boolean
    DestinationCredentials:
      type: object
      additionalProperties: false
      required:
      - access_key
      - secret_key
      properties:
        access_key:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        secret_key:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
        session_token:
          type: string
          maxLength: 8192
          writeOnly: true
    Destination:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - name
      - config
      - enabled
      - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - webhook
          - s3
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: '#/components/schemas/DestinationConfig'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
    DestinationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - name
      - config
      - enabled
      - created_at
      - schema
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - webhook
          - s3
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: '#/components/schemas/DestinationConfig'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
        schema:
          type: string
          const: financewolf/einvoice/destination/v1
        signing_secret:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: One-time hex-encoded 32-byte HMAC secret. Decode hex before verifying signatures.
    DestinationCreateRequest:
      type: object
      additionalProperties: false
      required:
      - type
      - name
      - config
      properties:
        type:
          type: string
          enum:
          - webhook
          - s3
        name:
          type: string
          minLength: 1
          maxLength: 100
        config:
          $ref: '#/components/schemas/DestinationConfig'
        credentials:
          $ref: '#/components/schemas/DestinationCredentials'
    DestinationUpdateRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        enabled:
          type: boolean
        rotate_secret:
          type: boolean
        credentials:
          $ref: '#/components/schemas/DestinationCredentials'
      minProperties: 1
    DeliveryArtifact:
      type: object
      additionalProperties: false
      required:
      - name
      - content_type
      - sha256
      - bytes
      properties:
        name:
          type: string
          enum:
          - result.json
          - document.xml
        content_type:
          type: string
          enum:
          - application/json
          - application/xml
        sha256:
          $ref: '#/components/schemas/SHA256'
        bytes:
          type: integer
          minimum: 1
    DeliveryEvent:
      type: object
      additionalProperties: false
      required:
      - schema
      - id
      - type
      - created_at
      - state_version
      - data
      properties:
        schema:
          type: string
          const: financewolf/einvoice/event/v1
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - einvoice.validation.completed
          - einvoice.generation.completed
          - einvoice.operation.failed
        created_at:
          type: string
          format: date-time
        state_version:
          type: integer
          const: 1
        data:
          type: object
          additionalProperties: false
          required:
          - operation_id
          - operation
          - status
          - outcome
          - input_sha256
          - usage_charged
          - artifacts
          properties:
            operation_id:
              type: string
              format: uuid
            operation:
              type: string
              enum:
              - validate
              - generate
            status:
              type: string
              enum:
              - completed
              - error
            outcome:
              type: string
              enum:
              - valid
              - invalid
              - indeterminate
            failure_code:
              type: string
            ruleset_id:
              type: string
            input_sha256:
              $ref: '#/components/schemas/SHA256'
            usage_charged:
              type: boolean
            job_id:
              type: string
              format: uuid
            batch_id:
              type: string
              format: uuid
            result_url:
              type: string
              format: uri-reference
            artifacts:
              type: array
              maxItems: 2
              items:
                $ref: '#/components/schemas/DeliveryArtifact'
    Delivery:
      type: object
      additionalProperties: false
      required:
      - id
      - event_id
      - operation_id
      - destination_id
      - status
      - attempts
      - max_attempts
      - created_at
      - expires_at
      - next_attempt_at
      - event
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        destination_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - delivering
          - delivered
          - failed
        attempts:
          type: integer
          minimum: 0
          maximum: 32
        max_attempts:
          type: integer
          minimum: 1
          maximum: 32
        failure_code:
          type: string
          enum:
          - destination_unavailable
          - credentials_unavailable
          - network_error
          - http_rejected
          - storage_rejected
          - object_conflict
          - result_unavailable
          - internal_error
          - lease_expired
          - event_expired
        http_status:
          type: integer
          minimum: 1
          maximum: 599
        created_at:
          type: string
