  /v1/einvoices/deliveries:
    get:
      operationId: listEinvoiceDeliveries
      summary: List delivery history with keyset pagination
      description: List delivery history with keyset pagination. Requires the listed API-key scope. See
        the deliveries tag for event, signature, retry, storage and retention semantics. Invoice validation
        and usage are unchanged by delivery. Destination, operation and status filters apply before
        pagination. Pending selects pending deliveries without attempts; retrying selects pending deliveries
        with at least one attempt. Only deliveries of V1 events are listed here; an operation made through
        /finance/v2 queues a V2 event, whose deliveries V2 lists at /finance/v2/einvoices/deliveries
        together with these.
      tags:
      - deliveries
      security:
      - platformKey: []
      x-ironfang-scopes: [finance:einvoices:read]
      responses:
        '200':
          description: 'Success. All responses use Cache-Control: no-store.'
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - deliveries
                - next_cursor
                properties:
                  deliveries:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Delivery'
                  next_cursor:
                    type: string
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
