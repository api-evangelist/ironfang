openapi: 3.1.0
# Ironfang Finance E-Invoicing public contract, V1 (FW-013).
#
# This document is the contract FW-020 implements. It is deliberately narrow:
# the synchronous validation journey and read access to the immutable ruleset
# registry, atomic generation, readable PDFs, signed reports and durable jobs/batches.
# Documents and Peppol transport are owned by later slices, which extend this file rather than
# being guessed at here.
#
# Conventions: render returns a PDF; other response bodies are a versioned result document or an
# RFC 9457 Problem. Validation findings are never Problems - a document that
# fails the standard is a successfully processed validation. Arrays are always
# present and never null. Hashes are lowercase hex. Times are RFC 3339 UTC.
#
# Serving obligation (FW-020): this document is served at GET /openapi.yaml
# under the product prefix, and every example it references by externalValue
# is served at exactly that URL (GET /examples/{name} under the same prefix),
# from the same embedded filesystem (ContractFS) so the two cannot diverge.
info:
  title: Ironfang Finance E-Invoicing API
  version: 1.4.0
  summary: Generate UBL invoices and validate Invoice or CreditNote XML with PHIVE.
  description: |
    Ironfang Finance validates UBL e-invoices against the exact EN 16931 and Peppol
    BIS Billing rule releases published by the standards bodies, and returns a
    result that names the immutable ruleset it used so the outcome can be
    reproduced later.

    The production path is the Ironfang Finance Go API/generator, a self-hosted Java
    service, PHIVE with upstream UBL / EN 16931 / Peppol artefacts, and Saxon.
    XML well-formedness, UBL schema, EN 16931 and Peppol findings remain separate
    layers. Generated XML is validated as the exact bytes returned to the caller.
    GET /v1/einvoices/rulesets identifies releases and, where available, observed
    runtime dependency versions. Library versions are not specification versions.

    Validation does not transmit invoices, make Ironfang a Peppol Access Point,
    register participants, certify legal or tax compliance, or guarantee recipient
    acceptance. Uploaded documents are not silently corrected.

    Billing belongs to the organisation's Ironfang billing account at /billing/v1;
    Finance's own usage is GET /v1/einvoices/usage. The retired plan and
    subscription read, GET /v1/einvoices/billing, answers `410 billing_moved`
    to every request.

    **Authentication.** The V1 boundary accepts Ironfang platform API keys
    only (`Authorization: Bearer <key>`), minted in the Ironfang portal with
    Ironfang Finance scopes. There is no OAuth or user-token access to this API
    yet; nothing in this contract should be read as advertising one.

    **Anonymous use.** Validation, generation, report verification, public signing keys and both ruleset reads
    accept requests with no credentials. Anonymous validation is validation
    only: no operation or document is stored, no report or evidence link is
    produced, no usage or entitlement information is returned, and tighter
    per-address rate limits apply. The result shape is otherwise identical.

    **Saved results.** Authenticated response bytes and findings are kept for
    30 days and may be deleted earlier through the result API. Synchronous validation
    does not store uploaded XML. Durable jobs temporarily retain encrypted XML or generation
    JSON until completion, cancellation or 24-hour expiry; cleanup runs each minute.
    Expired payloads are never executed. Database backups follow their own retention policy. Authenticated generation retains the exact generated XML in its
    result. POST /v1/einvoices/render reads that result to produce a readable PDF
    without another usage charge; the structured XML remains authoritative. After expiry/deletion, replay under the same Idempotency-Key
    answers `410 result_gone` without running or charging again. Operation
    identity hashes and usage metadata remain until organisation erasure.
    Existing results receive 30 days from the retention migration.

    **Durable jobs.** Authenticated POST /v1/einvoices/jobs and /batches accept
    validation or generation work, returning 202 metadata after atomic persistence.
    Poll the job/batch; fetch completed response bytes using its operation_id through
    /results/{id}. Idempotency-Key replays return 200 current metadata, including after
    result deletion, without rerunning work. This differs from synchronous replay.
    Job and batch key scopes are independent. Pending usage_charged=false describes
    current usage; a completed billable validation or generation adds one ledger event.
    No HTTP request cancellation implicitly cancels an accepted job. POST /{id}/cancel
    is explicit and has no body. It preserves completed children of a batch.

    **Usage and billing.** Every authenticated validation and generation is
    admitted by the organisation's Ironfang billing account before it runs:
    one unit of `finance.validation` or `finance.generation`, each with its
    own free monthly allowance, charged when the rules run to a verdict (a
    generation when its document passes its own validation; that validation
    and the readable PDF are part of it) and returned otherwise. A replayed
    Idempotency-Key is never admitted again. Beyond the free allowance, paid
    usage needs the account's paid usage enabled and an approved business;
    refusals are the billing problems (`free_allowance_exhausted`,
    `payment_required`, `product_not_eligible` and the rest), the same codes
    every Ironfang product answers with. Anonymous requests are never
    metered.

    **Signed reports.** Report issuance reads a retained result with complete findings
    and requires a configured signer. The signature binds observations and exact bytes;
    report integrity is separate from invoice validity. Verification needs no account,
    stores no uploads and contacts no external services. Signing keys are published
    separately. An offline CLI supports independently obtained keys and TSA CA roots.

    **Validation is not transport.** Any `scheduled`, `sendable` or
    `historical` release may be validated against by exact id: historical
    for audit and reproduction, scheduled for migration testing. Only the
    keyword `latest` (and profile detection) is restricted to the currently
    `sendable` release. Sending a document over Peppol - a later slice -
    is what requires a sendable release; validation never does.

    **Indeterminate outcomes.** A timeout, validator crash or internal
    dependency failure is *indeterminate*: it is never reported as `invalid`
    and never billed as a completed validation. Indeterminate outcomes are
    delivered as Problems - `504 validation_timeout`,
    `503 validator_unavailable` or `500 internal_error` on the validate
    operation - each carrying `outcome: indeterminate` and
    `usage_charged: false`. A `200` validation response is a verdict:
    `status: completed` with `outcome` `valid` or `invalid`, and no layer in
    `error`; the response schema (`ValidationVerdict`) admits nothing else.

    **For agents and tools.** The canonical base URL is
    https://api.ironfang.com/finance and every operation has a stable
    `operationId`. Every error an operation returns is an RFC 9457 Problem
    (`application/problem+json`): branch on `code` and `status`; `type` is the
    code's own URL under https://ironfang.com/problems/ and `request_id` is the
    value to quote to support. The machine-readable index of the Ironfang APIs
    is https://ironfang.com/.well-known/api-catalog, and
    https://ironfang.com/llms.txt is a plain-text map of them for a language
    model. The MCP server at https://mcp.ironfang.com/mcp (see
    https://ironfang.com/docs/mcp) carries reference tools only for this
    product - rule and ruleset lookup; validating or generating a document is
    done with this REST API. Financewolf is the name the product launched
    under, not a separate product. It survives in the `financewolf/...` schema
    and canonicalisation identifiers and the `financewolf-einvoicing` product
    value, which are recorded in signed evidence and do not change. Its
    `/financewolf` prefix and `X-Financewolf-*`/`Financewolf-*` headers were
    retired on 28 September 2026, and the prefix now answers `410`.
