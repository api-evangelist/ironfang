  /v1/einvoices/jobs:
    get:
      operationId: listEinvoiceJobs
      summary: List jobs
      description: Tenant-scoped metadata, newest first by creation time and ID. Equal
        timestamps retain stable pagination. Newer insertions do not appear on subsequent
        pages; refresh the first page to see them. No input payloads or child job bodies
        in batch summaries. A final page has an empty next_cursor. Responses are no-store.
        The JWT portal twin has the same response and pagination contract. Only V1 jobs and
        batches are listed, read or cancelled here; one made through /finance/v2 is not
        found, and V2 lists both at /finance/v2/einvoices/jobs and /finance/v2/einvoices/batches.
      tags:
      - jobs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
        description: Pass next_cursor from the preceding page; empty means the first page.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
      responses:
        '200':
          description: One bounded page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
