      - name: operation_id
        in: query
        schema: { type: string, format: uuid }
      - name: status
        in: query
        schema: { type: string, enum: [pending, retrying, delivering, delivered, failed] }
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
