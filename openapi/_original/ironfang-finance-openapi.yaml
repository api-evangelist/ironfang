    GenerationDefPayment:
      type: object
      additionalProperties: false
      properties:
        code:
          enum:
          - '10'
          - '30'
          - '58'
          - '97'
        reference:
          $ref: '#/components/schemas/GenerationDefId'
        account:
          $ref: '#/components/schemas/GenerationDefAccount'
      required:
      - code
      allOf:
      - if:
          properties:
            code:
              enum:
              - '30'
              - '58'
