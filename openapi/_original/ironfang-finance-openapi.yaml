        item:
          $ref: '#/components/schemas/GenerationDefItem'
        tax:
          $ref: '#/components/schemas/GenerationDefTax'
        allowances:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefLineAdjustment'
          minItems: 1
          maxItems: 100
        charges:
          type: array
          items:
            $ref: '#/components/schemas/GenerationDefLineAdjustment'
          minItems: 1
          maxItems: 100
        note:
          $ref: '#/components/schemas/GenerationDefText'
        order_line_reference:
          $ref: '#/components/schemas/GenerationDefId'
        accounting_cost:
          $ref: '#/components/schemas/GenerationDefId'
      required:
