tags:
  - name: billing
    description: >-
      Ironfang Finance usage as the organisation's billing account meters it,
      beside Finance's own content-free record. Payment, limits and invoices
      belong to the account at /billing/v1.
  - name: deliveries
    description: >-
      Destinations subscribe to future terminal validation/generation operations in their
      organisation. Delivery is at least once, independently retried, and never changes validation,
      usage or Peppol network state. Event IDs and payload bytes are immutable; deduplicate IDs and
      tolerate out-of-order arrival. Events/history expire after 30 days. Signed webhooks use
      Ironfang-Event-Id, Ironfang-Timestamp and Ironfang-Signature (v1=HMAC-SHA256 of
      timestamp + dot + exact body, with the hex-decoded secret). Verify the signature with a
      constant-time comparison, reject timestamps outside a five-minute tolerance, and persist event
      IDs before acknowledging. S3 writes retained result.json and generated document.xml under
      prefix/finance/{event_id}/, then manifest.json last. Validation source XML, PDFs and signed
      report ZIPs are not automatically exported. S3-compatible endpoints must honour conditional
      PutObject (If-None-Match: *); existing objects are checked by SHA-256 metadata and size.
      Customer bucket copies follow customer retention; deleting an Ironfang Finance result cannot revoke
      an upload already in flight. HTTPS public destinations only; query parameters, URL credentials,
      fragments and redirects are refused. Maximum 10 non-retired destinations; 8 initial attempts and at
      most 32 including manual retries. Disable before rotating secrets if a coordinated receiver
      cutover is needed; in-flight attempts may use the previous key.

  - name: jobs
    description: Authenticated durable validation and generation jobs and ordered batches.
  - name: validation
    description: PHIVE validation of UBL Invoice and CreditNote XML with structured findings.
  - name: generation
    description: Deterministic JSON-to-UBL generation, validated before success.
  - name: reports
    description: Signed validation observations and independent report integrity verification.
  - name: rendering
    description: Safe readable PDFs of retained successfully validated generation results.
  - name: results
    description: Authenticated retained validation and generation results.
  - name: rulesets
    description: The immutable ruleset registry validation results are pinned to.

security:
  - {}
  - platformKey: []

paths:
  /v1/einvoices/usage:
    get:
      operationId: getEinvoiceUsage
      summary: Read Ironfang Finance usage for a month
      description: >-
        Requires finance:billing:manage. The month's `finance.validation` and
        `finance.generation` meters as the organisation's billing account
        holds them - free allowance, used, reserved by unfinished work and
        the charge so far before tax - and Finance's own record of the same
        month beside them (`operations`), whose charged operations and usage
        events always agree. `metered` is false where unified billing is off:
        nothing is charged there and `meters` is empty. Work belongs to the
        month it was admitted in, whenever it completes.
      tags:
      - billing
      security:
      - platformKey: []
      x-ironfang-scopes: [finance:billing:manage]
      responses:
        '200':
          description: 'Private usage metadata. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/ReadRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
      parameters:
      - in: query
        name: period
        required: false
        description: A past or current UTC calendar month as YYYY-MM; the current month when omitted.
        schema:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
  /v1/einvoices/destinations:
    post:
      operationId: createEinvoiceDestination
      summary: Create a webhook or S3 destination
      description: Create a webhook or S3 destination. Requires the listed API-key scope. See the deliveries
        tag for event, signature, retry, storage and retention semantics. Invoice validation and usage are
        unchanged by delivery.
      tags:
      - deliveries
      security:
      - platformKey: []
      x-ironfang-scopes: [finance:einvoices:destinations:manage]
      responses:
        '201':
          description: 'Success. All responses use Cache-Control: no-store.'
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationCreated'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/DeliveryRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
      requestBody:
        required: true
        description: One JSON object, maximum 16 KiB. Unknown, duplicate and null fields are rejected. Credentials
          are encrypted and never returned; webhook create/rotate returns its signing secret once.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreateRequest'
    get:
      operationId: listEinvoiceDestinations
      summary: List active destination configurations
      description: List active destination configurations. Requires the listed API-key scope. See the deliveries
        tag for event, signature, retry, storage and retention semantics. Invoice validation and usage are
        unchanged by delivery.
      tags:
      - deliveries
      security:
      - platformKey: []
      x-ironfang-scopes: [finance:einvoices:destinations:manage]
      responses:
        '200':
          description: 'Success. All responses use Cache-Control: no-store.'
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - destinations
                properties:
                  destinations:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/DeliveryRateLimited'
        '500':
          $ref: '#/components/responses/ReadInternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /v1/einvoices/destinations/{id}:
    get:
      operationId: getEinvoiceDestination
      summary: Read a destination without its credentials
      description: Read a destination without its credentials. Requires the listed API-key scope. See the
        deliveries tag for event, signature, retry, storage and retention semantics. Invoice validation
        and usage are unchanged by delivery.
      tags:
      - deliveries
      security:
      - platformKey: []
      x-ironfang-scopes: [finance:einvoices:destinations:manage]
