  /v2/einvoices/jobs:
    post:
      tags: [jobs]
      operationId: submitEInvoiceJobV2
      summary: Queue one validation
      description: |
        Queues one validation: `document_base64` holds the document's
        bytes, `media_type` says what they are (the content must agree, as
        in synchronous validation) and `options` are the synchronous
        options. XML at most 5 MiB, a PDF at most 20 MiB; the envelope at
        most 28 MiB.

        **Acceptance.** Every decision synchronous validation makes before
        it validates is made now: the document's content and size, the
        scope, a PDF's inspection and its embedded invoice, and the release
        `latest` or the ruleset id resolves to. A document it would refuse is
        refused here with the same Problem, and nothing is queued or
        charged. An accepted job is pinned to that release and its engines,
        and one validation is reserved on the billing account until the job
        finishes: charged if it reaches a verdict, returned otherwise. A
        batch is admitted whole or not at all.

        **Running.** The job runs through the same validation as
        `POST /v2/einvoices/validate`. Its result is a V2 validation result,
        read at `result_url` once the job is `completed`; its usage and its
        webhook or S3 event (`ironfang/finance/einvoice/event/v2`, naming
        `job_id`) are a synchronous validation's. An unavailable engine or a
        timeout is retried, up to 3 attempts; then the job is `failed`,
        indeterminate and uncharged. The document is held encrypted until
        the job finishes, at most 24 hours (`expires_at`), then erased.

        **Queue.** An organisation holds at most 100 unfinished jobs and
        25 MiB of their documents; more is `429 quota_exhausted`.

        **Idempotency.** As synchronous validation, with the request
        identified by the document's bytes, the options and the scope. Keys
        are V2's own, apart from V1 jobs and from synchronous validation.
      security:
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '200':
          description: The job this Idempotency-Key already names, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Accepted and queued. Location names the job. Cache-Control is no-store.
          headers:
            Location:
              description: /finance/v2/einvoices/jobs/{id}
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                queued:
                  summary: A ZUGFeRD PDF queued
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-job.json
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/ScopeOrEligibility' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '410': { $ref: '#/components/responses/AdmissionGone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '422': { $ref: '#/components/responses/AdmissionRefused' }
        '429':
          description: >-
            Rate limited, the queue full, or the billing account can admit no
            more of this work this month. Nothing was queued.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { enum: [rate_limited, quota_exhausted, free_allowance_exhausted, account_budget_exhausted, product_budget_exhausted, exemption_limit_reached] }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: The release's engine is not available, durable jobs are not configured, or billing is briefly unavailable. Nothing was queued.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { enum: [validator_unavailable, jobs_unavailable, billing_temporarily_unavailable] }
        '504':
          description: A PDF could not be inspected within the admission deadline. Nothing was queued.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { const: validation_timeout }
