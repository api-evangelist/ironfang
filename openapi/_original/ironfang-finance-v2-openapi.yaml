# x-archived-on: 2026-10-03
openapi: 3.1.0
# Ironfang Finance E-Invoicing public contract, V2: several invoice families.
#
# V1 (../httpapi/openapi.yaml) stays exactly as published: Peppol BIS
# Billing 3 in UBL 2.1, five fixed layers. V2 is the contract for more than
# one family - XRechnung, ZUGFeRD / Factur-X and Peppol - where the layers a
# result reports are the ones the selected pipeline runs, and a PDF with
# embedded invoice XML is an input.
#
# This document precedes its handlers on purpose. Nothing here is served
# until the handlers exist; a family, variant or scope appears in a
# successful response only when a pinned ruleset for it is active.
#
# Conventions: bodies are a versioned result document or an RFC 9457 Problem.
# Validation findings are never Problems: an invoice that fails a standard is
# a completed validation. Arrays are always present and never null. Hashes
# are lowercase hex. Times are RFC 3339 UTC.
#
# Serving obligation: this document is served at GET /v2/openapi.yaml under
# the product prefix, and every example it references by externalValue at
# GET /v2/examples/{name}, from the embedded filesystem (ContractFS).
info:
  title: Ironfang Finance E-Invoicing API
  version: 2.0.0
  summary: Validate XRechnung, ZUGFeRD / Factur-X and Peppol invoices, as XML or as a PDF with embedded XML.
  description: |
    V2 validates an e-invoice against the exact, immutable ruleset of its
    family and reports precisely what was checked. It exists beside V1,
    which is unchanged: V1 clients keep their Peppol-only shapes, and a V2
    result is never returned through a V1 route.

    **Families.** `xrechnung` (the German CIUS of EN 16931, in UBL or
    UN/CEFACT CII), `zugferd-facturx` (the shared ZUGFeRD / Factur-X
    implementation, as CII XML or embedded in a PDF/A-3) and
    `peppol-bis-billing-3`. ZUGFeRD and Factur-X are corresponding release
    names of one standard, validated once. `GET /v2/einvoices/rulesets` lists
    exactly which family, variant, syntax, document type and scope each
    active release covers; nothing else is supported.

    **Scope.** An XML body is checked at `xml` scope: the invoice XML
    against its schema and rules. A PDF body is checked at `hybrid_pdf`
    scope: PDF/A-3 conformance, the invoice attachment and its metadata,
    and the embedded invoice XML, each reported separately. A PDF is never
    silently checked as XML only, and XML success never reads as a complete
    hybrid check. `coverage` lists what was not checked: a PDF that was not
    supplied, the visual PDF content against the XML (never compared), and
    digital signatures (never verified).

    **Reduced profiles.** ZUGFeRD / Factur-X MINIMUM and BASIC WL are not
    full EN 16931 invoices. A pass against them is a pass against that
    profile's rules, and `coverage` says the EN 16931 semantic model was not
    established.

    **What a result is not.** Validation does not transmit invoices,
    certify legal or tax compliance, or guarantee acceptance by a recipient
    or a submission portal. Documents are never corrected.

    **Authentication, anonymous use, idempotency and retention** follow V1:
    Ironfang platform API keys (`Authorization: Bearer`), anonymous
    validation with nothing stored and tighter rate limits, optional
    `Idempotency-Key` on authenticated requests, 30-day retained results.
    Uploaded XML or PDF bytes are not stored by synchronous validation.

    **Durable jobs.** `POST /v2/einvoices/jobs` queues one validation and
    `POST /v2/einvoices/batches` 1 to 100 together, each document base64 in
    JSON. Everything synchronous validation decides before it validates is
    decided when a job is accepted, so a document it would refuse is
    refused then, and nothing is queued or charged. An accepted job's
    document is held encrypted until it finishes, at most 24 hours. Its
    result, usage and webhook or S3 event are exactly a synchronous
    validation's.

    **Problems.** Every error is an RFC 9457 Problem
    (`application/problem+json`); branch on `code`:

    | code | status | meaning |
    | --- | --- | --- |
    | `malformed_request` | 400 | The request is malformed: an unknown or repeated parameter or part, an invalid value, or a body that is not one document. |
    | `unauthenticated` | 401 | The credential is missing, malformed, unknown or revoked. |
    | `paid_usage_paused` | 402 | Paid usage is paused for the billing account and the free allowance is used up. |
    | `payment_required` | 402 | Paid usage needs a working payment method. |
    | `payment_action_required` | 402 | A payment needs the account holder's confirmation before paid usage continues. |
    | `account_restricted` | 402 | Paid usage is restricted on the billing account. |
    | `product_not_eligible` | 403 | Paid Ironfang Finance usage needs an approved business; the free allowance is used up. |
    | `insufficient_scope` | 403 | The key lacks the scope this operation needs. |
    | `not_found` | 404 | No such resource is visible to the caller. |
    | `idempotency_conflict` | 409 | The Idempotency-Key was used for a different request. |
    | `ruleset_disabled` | 410 | The ruleset was withdrawn from every use. |
    | `account_closed` | 410 | The billing account is closed. |
    | `result_gone` | 410 | The original result behind this Idempotency-Key has expired or was deleted; nothing was run again. |
    | `payload_too_large` | 413 | The body is over the published limit for its media type. |
    | `unsupported_content_type` | 415 | The body's media type, encoding or content is not one this operation accepts. |
    | `unknown_ruleset` | 422 | The ruleset id names no release that can be validated against, or no current release exists for the selection. |
    | `selection_conflict` | 422 | The selectors disagree with each other or with the named ruleset. |
    | `family_undetected` | 422 | The document declares no family Ironfang recognises; name a family or an exact ruleset. |
    | `family_mismatch` | 422 | The document declares a different family from the one requested. |
    | `unsupported_variant` | 422 | The document declares a variant or profile Ironfang recognises but does not validate yet. |
    | `unsupported_document_type` | 422 | The document type is not one the selected ruleset validates, or it contradicts the document. |
    | `scope_unavailable` | 422 | The requested scope cannot be checked with this input, such as hybrid scope for an XML body or XML scope for a PDF. |
    | `no_embedded_invoice` | 422 | The PDF carries no embedded invoice XML Ironfang could identify. |
    | `ambiguous_embedded_invoice` | 422 | The PDF carries more than one plausible invoice XML; none was chosen. |
    | `encrypted_pdf` | 422 | The PDF is encrypted or password-protected. |
    | `processing_limit` | 422 | The document is over a published processing limit (pages, attachments, decoded size); this is not a verdict on the invoice. |
    | `rate_limited` | 429 | Too many requests from this caller. |
    | `free_allowance_exhausted` | 429 | This month's free allowance is used up and paid usage is not enabled. |
    | `account_budget_exhausted` | 429 | The billing account's monthly usage limit is reached. |
    | `product_budget_exhausted` | 429 | The monthly usage limit for Ironfang Finance is reached. |
    | `exemption_limit_reached` | 429 | The account's agreed monthly limit is reached. |
    | `quota_exhausted` | 429 | The organisation's queue of unfinished jobs is full (job and batch submission). |
    | `internal_error` | 500 | Ironfang Finance failed while processing the request. |
    | `validator_unavailable` | 503 | The validator for the selected ruleset is not available. |
    | `delivery_unavailable` | 503 | Destination delivery is not configured (delivery retry). |
    | `jobs_unavailable` | 503 | Durable jobs are not configured on this deployment (job and batch submission). |
    | `billing_temporarily_unavailable` | 503 | Billing is briefly unavailable; retry shortly. |
    | `report_incomplete` | 422 | The retained result's findings were truncated, so no complete signed report can be issued. |
    | `report_unavailable` | 503 | Signed report issuance is not configured, or a readable PDF was asked for a result that has none. |
    | `validation_timeout` | 504 | Validation did not finish within the deadline. |

    `validator_unavailable`, `validation_timeout` and, on validation,
    `internal_error` are indeterminate: they carry `outcome: indeterminate`
    and `usage_charged: false`, and nothing is billed.
  contact:
    name: Ironfang
    email: hello@ironfang.uk
    url: https://ironfang.com/finance
  termsOfService: https://ironfang.com/legal/terms
  license:
    name: Proprietary
    identifier: LicenseRef-Ironfang-Proprietary

servers:
  - url: https://api.ironfang.com/finance
    description: Production. Paths below are relative to this product prefix.

externalDocs:
  description: Ironfang Finance documentation
  url: https://ironfang.com/docs/finance

tags:
  - name: validation
    description: Validate one invoice, XML or PDF.
  - name: rulesets
    description: The immutable releases a validation can name.
  - name: results
    description: Retained results, V1 and V2 together.
  - name: deliveries
    description: Webhook and S3 deliveries of V1 and V2 events together.
  - name: jobs
    description: Durable validation jobs and batches, V1 and V2 together.
  - name: reports
    description: Signed reports of retained results, and their verification.

paths:
  /v2/einvoices/validate:
    post:
      tags: [validation]
      operationId: validateEInvoiceV2
      summary: Validate one invoice, as XML or as a PDF with embedded invoice XML
      description: |
        **Body.** Send the document itself with `Content-Type`
        `application/xml`, `text/xml` or `application/pdf`, choosing with the
        query parameters. Or send `multipart/form-data` with one `document`
        part (one of those media types) and an optional `options` part
        holding a JSON `ValidationOptions` object; query parameters are not
        read for multipart requests. The media type is a hint: the content
        is inspected, and an XML part holding a PDF (or the reverse) is
        `415 unsupported_content_type`. Archives and compressed bodies are
        refused the same way.

        **Limits.** XML at most 5 MiB (5,242,880 bytes), 64 levels deep,
        250,000 elements. PDF at most 20 MiB, 200 pages and 20 embedded
        files; the embedded invoice XML at most 5 MiB; 25 MiB of decoded
        attachment data in total; 256 MiB of compressed (Flate) content
        decoded across the whole PDF. Over a byte limit is `413`; over any other
        processing limit is `422 processing_limit`, which is not a verdict on
        the invoice. The XML deadline is 10 seconds and the hybrid deadline
        30 seconds; exceeding it is indeterminate (`504`).

        **Selection.** `ruleset` is `latest` (default) or an exact ruleset
        id.

        - With an exact id, the release supplies family, variant, syntax,
          document type and scope. Any selector also sent must equal the
          release's value, or the request is `422 selection_conflict`; the
          document must fit the release (`422 unsupported_document_type`,
          `422 family_mismatch`).
        - With `latest`, the family is the one requested or, without
          `family`, the one the document declares
          (`selection_method: detected`); an undeclared or unknown family is
          `422 family_undetected`. A requested family the document
          contradicts is `422 family_mismatch`, and the Problem's
          `detected` says what the document declares, so a client can offer
          the right tool; the document is never validated under the wrong
          family. The variant is the one the document declares; a variant
          Ironfang recognises but does not validate is
          `422 unsupported_variant`, never a fallback to a weaker profile.
        - `scope` defaults to `xml` for XML and `hybrid_pdf` for a PDF.
          Any other combination is `422 scope_unavailable`. To inspect only
          the XML inside a PDF, extract it explicitly
          (`POST /tools/v2/invoice/extract`) and validate that XML.

        **PDF inputs.** An encrypted PDF is `422 encrypted_pdf`. A PDF with
        no identifiable embedded invoice XML is `422 no_embedded_invoice`,
        and one with more than one plausible invoice XML is
        `422 ambiguous_embedded_invoice`: no attachment is ever chosen
        arbitrarily. These three are uncharged. Everything wrong with an
        identified embedded invoice - its name, relationship, media type,
        metadata, PDF/A conformance, or the XML itself - is a finding in a
        completed validation.

        **Outcome.** `200` is always a verdict: `status: completed`,
        `outcome` `valid` or `invalid`, and every check that ran completed.
        A deterministic defect makes the outcome `invalid`, and checks it
        prevented are `skipped` with a reason. A timeout, an unavailable
        validator or an internal failure is a Problem with
        `outcome: indeterminate`; known findings are never presented as a
        verdict.

        **Usage.** One completed validation is one operation, whatever the
        scope; the checks inside it are not billed separately. As in V1, a
        completed validation is charged once its schema check (`xsd`)
        reached a verdict, passed or failed; a document that is not
        well-formed XML ends before it and is not charged. Rejected
        requests and indeterminate outcomes are not charged. An
        authenticated verdict carries `operation_id` and `usage`, and is
        retained for 30 days as V1 results are; it is served only through
        V2, never through a V1 result, list or report.

        **Idempotency.** As V1, with the request identified by the input
        bytes (for a PDF, the PDF's own bytes), the selectors and the scope.
        A replay returns the original operation and its result, even if
        `latest` has since moved.

        **Findings.** At most 1,000 inline, ordered by the pipeline's layer
        order, then severity (`fatal`, `warning`, `information`), then
        `rule_id`, then location, then message. `findings_summary` states
        the totals and whether truncation happened.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: ruleset
          in: query
          required: false
          description: "`latest` (default) or an exact ruleset id. Raw bodies only."
          schema:
            $ref: '#/components/schemas/RulesetSelector'
        - name: family
          in: query
          required: false
          description: "The family to resolve `latest` within. Omit to use the family the document declares. Raw bodies only."
          schema:
            $ref: '#/components/schemas/Family'
        - name: variant
          in: query
          required: false
          description: "The variant or profile expected. It must match what the document declares. Raw bodies only."
          schema:
            $ref: '#/components/schemas/Variant'
        - name: document_type
          in: query
          required: false
          description: "Expected document type, or `auto` (default). Raw bodies only."
          schema:
            $ref: '#/components/schemas/DocumentTypeSelector'
        - name: scope
          in: query
          required: false
          description: "Expected scope. Defaults from the body: `xml` for XML, `hybrid_pdf` for a PDF. Raw bodies only."
          schema:
            $ref: '#/components/schemas/Scope'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/XMLDocument'
          text/xml:
            schema:
              $ref: '#/components/schemas/XMLDocument'
          application/pdf:
            schema:
              $ref: '#/components/schemas/PDFDocument'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties:
                document:
                  description: The XML or PDF document.
                  type: string
                  contentMediaType: application/octet-stream
                options:
                  $ref: '#/components/schemas/ValidationOptions'
            encoding:
              document:
                contentType: application/xml, text/xml, application/pdf
              options:
                contentType: application/json
      responses:
        '200':
          description: A verdict within the reported scope.
          headers:
            X-Ironfang-Request-ID:
              $ref: '#/components/headers/XIronfangRequestID'
            X-Request-ID:
              $ref: '#/components/headers/XRequestIDEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationVerdict'
              examples:
                xrechnung-ubl-valid:
                  summary: A valid XRechnung UBL invoice, family detected; information findings do not fail it
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-validation-xrechnung-ubl-valid.json
                xrechnung-cii-invalid:
                  summary: An XRechnung CII invoice without a buyer reference, family requested
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-validation-xrechnung-cii-invalid.json
                peppol-valid:
                  summary: A Peppol BIS Billing 3 invoice, detected and run on the Peppol validator its release is pinned to
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-validation-peppol-valid.json
                zugferd-minimum-xml:
                  summary: A ZUGFeRD MINIMUM XML passes its reduced profile; no PDF was supplied
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-validation-zugferd-minimum-xml-valid.json
                zugferd-hybrid-container-failed:
                  summary: Invoice XML passed; the PDF container checks failed
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-validation-zugferd-hybrid-container-failed.json
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/ScopeOrEligibility' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '410':
          description: A withdrawn ruleset, a replayed result that has expired or was deleted, or a closed billing account.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { enum: [ruleset_disabled, result_gone, account_closed] }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '422':
          description: The selection cannot be made for this document, or the PDF cannot be processed. Uncharged.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code:
                        enum: [unknown_ruleset, selection_conflict, family_undetected, family_mismatch, unsupported_variant,
                               unsupported_document_type, scope_unavailable, no_embedded_invoice, ambiguous_embedded_invoice,
                               encrypted_pdf, processing_limit]
              examples:
                family-mismatch:
                  summary: A Peppol invoice sent to the XRechnung validator
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-problem-family-mismatch.json
                no-embedded-invoice:
                  summary: An ordinary PDF with no invoice XML inside
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-problem-no-embedded-invoice.json
        '429':
          description: Rate limited, or the billing account can admit no more of this work this month.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { enum: [rate_limited, free_allowance_exhausted, account_budget_exhausted, product_budget_exhausted, exemption_limit_reached] }
              examples:
                free-allowance-exhausted:
                  summary: The month's free validations are used up
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-problem-free-allowance-exhausted.json
        '500': { $ref: '#/components/responses/ValidationInternalError' }
        '503':
          description: >-
            The validator for the selected ruleset is not available
            (indeterminate and uncharged), or billing is briefly unavailable
            (nothing was accepted).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { enum: [validator_unavailable, billing_temporarily_unavailable] }
                  - if: { properties: { code: { const: validator_unavailable } } }
                    then: { required: [outcome, usage_charged] }
        '504':
          description: Validation did not finish within the deadline. Indeterminate and uncharged.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      code: { const: validation_timeout }
                    required: [outcome, usage_charged]
              examples:
                timeout:
                  summary: A hybrid validation that did not finish
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-problem-validation-timeout.json

  /v2/einvoices/rulesets:
    get:
      tags: [rulesets]
      operationId: listEInvoiceRulesetsV2
      summary: List the releases a V2 validation can name
      description: |
        The `scheduled`, `sendable` and `historical` releases of every
        family. Exactly one `sendable` release per capability (family,
        variant, syntax, document type and scope) carries `latest: true`: the
        one `ruleset=latest` resolves to now. A release of a family in this
        list is the only evidence that the family is supported.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:rulesets:read]
      parameters:
        - { name: family, in: query, required: false, schema: { $ref: '#/components/schemas/Family' } }
        - { name: variant, in: query, required: false, schema: { $ref: '#/components/schemas/Variant' } }
        - { name: document_type, in: query, required: false, schema: { $ref: '#/components/schemas/DocumentType' } }
        - { name: scope, in: query, required: false, schema: { $ref: '#/components/schemas/Scope' } }
        - { name: operation, in: query, required: false, schema: { $ref: '#/components/schemas/RulesetOperation' } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/RulesetState' } }
      responses:
        '200':
          description: The matching releases, newest effective date first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetList'
              examples:
                xrechnung:
                  summary: The XRechnung releases
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-ruleset-list-xrechnung.json
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v2/einvoices/rulesets/{id}:
    get:
      tags: [rulesets]
      operationId: getEInvoiceRulesetV2
      summary: One immutable release and its pipeline
      description: >-
        One release by id, in any public state (scheduled, sendable or
        historical), with its pipeline, layers and pinned engine. A release
        never changes once published; results name the release that produced
        them, so this is how to see exactly what checked a document.
      security:
        - {}
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:rulesets:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RulesetID'
      responses:
        '200':
          description: The release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/RulesetDisabled' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v2/einvoices/results:
    get:
      tags: [results]
      operationId: listEInvoiceResultsV2
      summary: List retained results, V1 and V2 together
      description: |
        A page of the organisation's retained results, newest first:
        validations and generations made through V1 and validations made
        through V2, each saying which API made it (`api_version`), the
        schema of its retained document (`result_schema`) and its family.
        `total` counts every matching record, expired and deleted ones
        included; names are hidden after expiry or deletion and cannot
        match `q`. Pass `next_cursor` as `cursor` for the next page.

        V1's own result list shows only V1 results: a V2 result is not a
        document its schema describes.
      security:
        - platformKey: []
      x-ironfang-scopes: [finance:einvoices:read]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [validate, generate] } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [valid, invalid] } }
        - { name: family, in: query, required: false, schema: { $ref: '#/components/schemas/Family' } }
        - { name: api_version, in: query, required: false, schema: { $ref: '#/components/schemas/APIVersion' } }
        - { name: ruleset, in: query, required: false, schema: { $ref: '#/components/schemas/RulesetID' } }
        - name: q
          in: query
          required: false
          description: Case-insensitive literal substring of the operation id or an available document name.
          schema: { type: string, minLength: 1, maxLength: 255 }
        - { name: operation_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueID' } }
      responses:
        '200':
          description: The page. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedResultList'
              examples:
                union:
                  summary: A V2 XRechnung validation beside a V1 Peppol one
                  externalValue: https://api.ironfang.com/finance/v2/examples/v2-result-list.json
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v2/einvoices/results/{id}:
    get:
      tags: [results]
