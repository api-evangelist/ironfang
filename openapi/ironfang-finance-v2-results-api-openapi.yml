    APIVersion:
      type: string
      description: The API a result was made through.
      enum:
      - v1
      - v2
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          enum:
          - unknown_field
          - repeated
          - invalid_value
          - missing
        message:
          type: string
          minLength: 1
          maxLength: 256
    Usage:
      type: object
      additionalProperties: false
      required:
      - charged
      - credits
      properties:
        charged:
          type: boolean
        credits:
          type: integer
          minimum: 0
          maximum: 1
        remaining:
          type: integer
          minimum: 0
          description: Only on results recorded before usage billing, returned as they were recorded.
        period_ends_at:
          type: string
          format: date-time
          description: Only on results recorded before usage billing, returned as they were recorded.
    Scope:
      type: string
      enum:
      - xml
      - hybrid_pdf
    RulesetSelector:
      type: string
      pattern: ^(latest|fwrs_[a-z0-9_]{1,80})$
    ValidationVerdict:
      type: object
      description: The result of one completed validation. `outcome` is decided by the fatal findings of the checks that ran, within `coverage`.
      additionalProperties: false
      required:
      - schema
      - status
      - outcome
      - input
      - declared
      - ruleset
      - coverage
      - groups
      - layers
      - counts
      - findings
      - findings_summary
      - timing
      - engines
      - next_actions
      properties:
        schema:
          type: string
          const: ironfang/finance/einvoice/validation-result/v2
        operation_id:
          $ref: '#/components/schemas/OpaqueID'
        status:
          type: string
          const: completed
        outcome:
          type: string
          enum:
          - valid
          - invalid
        input:
          $ref: '#/components/schemas/ValidationInput'
        declared:
          $ref: '#/components/schemas/Declared'
        ruleset:
          $ref: '#/components/schemas/RulesetSelection'
        coverage:
          $ref: '#/components/schemas/Coverage'
        groups:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/CheckGroup'
        layers:
          type: array
          minItems: 3
          maxItems: 9
          items:
            $ref: '#/components/schemas/LayerResult'
        counts:
          type: object
          additionalProperties: false
          required:
          - by_severity
          properties:
            by_severity:
              $ref: '#/components/schemas/SeverityCounts'
        findings:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Finding'
        findings_summary:
          $ref: '#/components/schemas/FindingsSummary'
        timing:
          $ref: '#/components/schemas/Timing'
        engines:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Engine'
        next_actions:
          type: array
          description: 'What this input supports next, from the capability registry: open the readable view, or extract the embedded XML. Never guessed by a client.'
          uniqueItems: true
          items:
            type: string
            enum:
            - view
            - extract_xml
        usage:
          $ref: '#/components/schemas/Usage'
    Timing:
      type: object
      additionalProperties: false
      required:
      - started_at
      - completed_at
      - duration_ms
      properties:
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
          maximum: 30000
    SHA256:
      type: string
      pattern: ^[0-9a-f]{64}$
    ValidationInput:
      type: object
      additionalProperties: false
      required:
      - media_type
      - bytes
      - sha256
      - document_type
      properties:
        media_type:
          type: string
          enum:
          - application/xml
          - application/pdf
        bytes:
          type: integer
          minimum: 0
          maximum: 20971520
        sha256:
          $ref: '#/components/schemas/SHA256'
        document_type:
          type: string
          enum:
          - invoice
          - credit_note
          - unknown
        embedded_xml:
          type: object
          description: For a PDF, the invoice XML exactly as extracted - original bytes, never re-serialised.
          additionalProperties: false
          required:
          - bytes
          - sha256
          properties:
            bytes:
              type: integer
              minimum: 0
              maximum: 5242880
            sha256:
              $ref: '#/components/schemas/SHA256'
            file_name:
              type: string
              maxLength: 128
              description: The attachment's name as declared in the PDF
              for display only.: null
    Layer:
      type: string
      description: A validation stage. A result reports the stages its pipeline runs, in the pipeline's order; no pipeline runs them all.
      enum:
      - input
      - pdfa
      - hybrid_binding
      - xml
      - xsd
      - en16931
      - peppol
      - xrechnung
      - zugferd_profile
    RetainedDocument:
      description: A retained document in the schema it was made under. A V1 document is described by the V1 contract (/finance/v1/openapi.yaml); here it is only named by its `schema`.
      oneOf:
      - $ref: '#/components/schemas/ValidationVerdict'
      - type: object
        required:
        - schema
        properties:
          schema:
            type: string
            enum:
            - financewolf/einvoice/validation-result/v1
            - financewolf/einvoice/generation-result/v1
  responses:
    InternalError:
      description: Ironfang Finance failed. Not a verdict on anything.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: internal_error
    NotFound:
      description: No such release or result is visible.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: not_found
    ResultGone:
      description: The result expired or was erased. Its operation record remains.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: result_gone
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: rate_limited
    MalformedRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: malformed_request
    InsufficientScope:
      description: The key lacks the scope this operation needs.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: insufficient_scope
    Unauthenticated:
      description: The credential is missing or not accepted.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                code:
                  const: unauthenticated
  headers:
    RetryAfter:
      description: Seconds to wait before retrying. Mirrors `retry_after_seconds`.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    platformKey:
      type: http
      scheme: bearer
      description: An Ironfang platform API key minted in the portal, carrying the scopes an operation lists.
externalDocs:
  description: Ironfang Finance documentation
  url: https://ironfang.com/docs/finance
