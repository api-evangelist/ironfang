capability_feed:
  url: https://api.ironfang.uk/renderwolf/v1/capabilities
  operation: getCapabilities
  auth: none - answers anonymously
  http_status: 200
  file: renderwolf-capabilities.json
  updated: '2026-08-28'
  note: >-
    An unusual and genuinely useful artifact: a public, unauthenticated, dated endpoint that
    states per capability whether it is live, planned or NOT OFFERED, with a `since` date on
    each recent addition and a `gap_heading` naming what Ironfang deliberately does not do.
    It is the closest thing Renderwolf publishes to a changelog and a roadmap, and it names its
    own gaps rather than only its features.
  live_since_2026_08_28: [async_jobs, webhooks, storage_delivery, batches]
  planned: [request_history, sdks, capture_bundle]
  not_offered: [azure_gcs_delivery, proxies, browser_actions]
  staleness: >-
    The `sdks` capability is still "planned" although the TypeScript client, Python client and
    CLI all shipped 0.1.0 on 2026-09-01, and `request_history` is "planned" although
    GET /v1/requests (listRequests) is in the published contract. The feed lags the API.
changelog:
  dated_changelog_published: false
  probes:
    - url: https://ironfang.uk/changelog
      status: 404
    - url: https://ironfang.uk/renderwolf/changelog
      status: 404
  note: >-
    No dated release-notes page exists. The capability feed's `since` dates and the GitHub
    release tags on renderwolf-cli are the only version history Ironfang publishes.
result_retention:
  hosted_results: 24 hours after success, then removed
  signed_download_links: 15 minutes, reissued on every read
  policy_note: A collection window, not asset hosting - Ironfang states customers should store what they need.
