versioning:
  style: URI path
  current: v1
  spec_version: '1.0.0'
  base_migration: >-
    api.ironfang.uk hosts every Ironfang product, so endpoints moved to a product-prefixed base
    (/renderwolf/v1/...). The legacy unprefixed /v1/ path remains supported for endpoints that
    previously shipped there; new endpoints appear only under the product base. Both are
    declared in the OpenAPI servers[], the second labelled "retained for existing clients".
  breaking_change_policy: >-
    Published for MCP only: tool names are a compatibility contract - names are added, and
    anything that changes semantics gets a new name. No equivalent statement is published for
    the REST API.
status_page:
  url: https://status.ironfang.uk
  http_status: 200
  provider: self-hosted, static
  cadence: Checks run every five minutes from an independent network.
  note: >-
    The page shell is served statically and fills in current status client-side; there is no
    published JSON status endpoint, no incident history feed and no RSS/Atom subscription.
