domain_standards:
  market: web rendering / screenshot and document generation APIs
  standard_declared: false
  note: >-
    REWARD-ONLY, and correctly empty. There is no interoperability standard for browser
    rendering APIs - the competitor set Ironfang itself names (ScreenshotOne, Urlbox) each
    publishes a bespoke parameter vocabulary, which is exactly why Ironfang ships
    parameter-mapping tables for switching rather than a conformance claim. Renderwolf does
    handle standard MEDIA formats (PNG, JPEG, WebP, PDF, H.264/MP4) and standard QR error
    correction levels, but consuming a format is not conforming to a domain API standard.
  probed_for:
    - 'ISO 32000 / PDF-A declaration in the PDF surface: not declared'
    - 'W3C Web Content Accessibility conformance claim on rendered output: not declared'
compliance_certifications:
  published: false
  note: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim is published, and no trust centre exists.
    See security/renderwolf-trust-center.yml. The only regulatory identifiers Ironfang publishes
    are UK corporate ones: Companies House registration 12764014 (England & Wales) and ICO data
    protection registration ZB444797, both in the site footer.
