generated: '2026-09-02'
method: searched
source: >-
  well-known/renderwolf-oauth-authorization-server.json,
  well-known/renderwolf-oauth-protected-resource.json,
  openapi/renderwolf-openapi.yaml, https://ironfang.uk/docs/mcp
note: >-
  Renderwolf's conformance story is concentrated in one place: the agent-authorization stack.
  The identity host implements the modern OAuth discovery and delegation RFCs properly, and the
  MCP server implements a current protocol revision. Outside that, the REST API is a plain
  bearer-key JSON API with a vendor error envelope and no adopted API-design standard.
entries:
  - id: openapi-3.1
    name: OpenAPI 3.1.0
    conforms: true
    evidence:
      - 'openapi/renderwolf-openapi.yaml - openapi: 3.1.0, 25 paths, 33 operations, 17 schemas'
      - https://api.ironfang.uk/openapi.yaml (HTTP 200, application/yaml)
    note: >-
      Every operation carries a unique operationId, a summary, tags and enumerated 2xx/4xx
      responses; securitySchemes are defined and applied globally. Ironfang states the spec is
      authoritative and the reference page is generated from it, not the reverse.
  - id: oauth2
