name: Ironfang

description: Ironfang Render is the rendering API from Ironfang Ltd, a UK software company that builds and operates self-service developer APIs.
  It turns a URL or a block of raw HTML into screenshots, PDFs, templated images, QR codes, captioned video clips and scrolling site previews
  over plain HTTPS and JSON, with no browser fleet for the customer to run. The v1 REST API is described by a published OpenAPI 3.1 contract covering
  33 operations across synchronous rendering, reusable HTML templates, signed render URLs, durable asynchronous jobs, batches of up to 100, and
  webhook or S3-compatible delivery destinations. A remote MCP server at mcp.ironfang.com exposes the same core to AI assistants over OAuth 2.1
  with a per-connection credit budget, and an llms.txt, a TypeScript and Python SDK, a CLI and an n8n node round out the surface. Plans are hard-capped
  rather than metered into overage, cache hits are free, and failed renders are refunded. Ironfang's own apis.json lists five more product APIs
  on the same account, portal and key format, each with its own published OpenAPI 3.1 contract under api.ironfang.com, for Audit (website evidence),
  Finance (e-invoice validation and generation, v1 and v2), Rig (disposable integration test environments), Analytics (session replay) and
  Security (external security checks).

